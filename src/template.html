<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__SLOPMAP_TITLE__</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #1a1a19;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }

    #graph {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #labels {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .section-label {
      position: absolute;
      top: 0;
      left: 0;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      will-change: transform;
    }

    .section-label-hub {
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
    }

    .section-label-subsection {
      color: #c3c2b7;
      font-size: 11px;
    }

    #panel,
    #detail-panel {
      position: fixed;
      z-index: 2;
      width: calc(100vw - 32px);
      padding: 14px 16px;
      color: #ffffff;
      background: rgba(26,26,25,0.92);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      backdrop-filter: blur(6px);
    }

    #panel {
      top: 16px;
      left: 16px;
      max-width: 340px;
    }

    #view-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      margin-bottom: 12px;
      padding: 2px;
      background: rgba(255,255,255,0.05);
      border-radius: 7px;
    }

    .view-button {
      padding: 5px 8px;
      color: #898781;
      background: transparent;
      border: 0;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
    }

    .view-button.active {
      color: #ffffff;
      background: #262624;
    }

    #compactness-setting {
      margin-bottom: 12px;
    }

    #compactness-label,
    #compactness-levels {
      color: #898781;
      font-size: 11px;
    }

    #compactness {
      width: 100%;
      margin: 3px 0 0;
      accent-color: #ec835a;
    }

    #compactness-levels {
      display: flex;
      justify-content: space-between;
    }

    #panel-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }

    #context-pill {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: min(60vw, 640px);
      padding: 7px 14px;
      background: rgba(26,26,25,0.92);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 999px;
      backdrop-filter: blur(6px);
      font-size: 12px;
      white-space: nowrap;
    }

    #context-pill[hidden] {
      display: none;
    }

    #context-pill-icon {
      flex: 0 0 auto;
      color: #c3c2b7;
    }

    #context-pill-icon path[hidden] {
      display: none;
    }

    #context-pill-branch {
      max-width: 30vw;
      overflow: hidden;
      color: #ffffff;
      font-weight: 500;
      text-overflow: ellipsis;
    }

    #context-pill-arrow,
    #context-pill-base {
      color: #898781;
    }

    #context-pill-pr {
      color: #3987e5;
      text-decoration: none;
    }

    #context-pill-pr:hover {
      text-decoration: underline;
    }

    #meta {
      margin-top: 4px;
      color: #c3c2b7;
      font-size: 12px;
      line-height: 1.4;
    }

    #legend {
      display: grid;
      gap: 6px;
      margin-top: 12px;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      color: #c3c2b7;
      font-size: 12px;
      line-height: 1.3;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-count {
      color: #898781;
    }

    #search {
      width: 100%;
      margin-top: 12px;
      padding: 7px 9px;
      color: #ffffff;
      background: #262624;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 6px;
      outline: none;
      font-size: 12px;
    }

    #search::placeholder {
      color: #898781;
    }

    #search:focus {
      border-color: rgba(255,255,255,0.24);
    }

    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 10px;
    }

    #theme-setting {
      margin-top: 10px;
    }

    #theme-label {
      margin-bottom: 4px;
      color: #898781;
      font-size: 11px;
    }

    #theme-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      padding: 2px;
      background: rgba(255,255,255,0.05);
      border-radius: 7px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #c3c2b7;
      font-size: 12px;
      line-height: 1.3;
      cursor: pointer;
    }

    .checkbox-label input {
      margin: 0;
      accent-color: #ec835a;
    }

    #section-filter[hidden] {
      display: none;
    }

    #section-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      margin-top: 10px;
      padding: 4px 7px;
      color: #c3c2b7;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      font-size: 12px;
    }

    #section-filter-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #clear-section-filter {
      padding: 0;
      color: #898781;
      background: transparent;
      border: 0;
      line-height: 1;
      cursor: pointer;
    }

    #hint {
      margin-top: 10px;
      color: #898781;
      font-size: 11px;
      line-height: 1.35;
    }

    #detail-panel {
      top: 16px;
      right: 16px;
      max-width: 360px;
      max-height: 70vh;
      overflow-y: auto;
    }

    #detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    #detail-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    #detail-close {
      flex: 0 0 auto;
      margin-top: -3px;
      padding: 0;
      color: #898781;
      background: transparent;
      border: 0;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    #detail-meta {
      margin-top: 4px;
      color: #898781;
      font-size: 12px;
      line-height: 1.4;
    }

    #detail-body {
      display: grid;
      gap: 7px;
      margin-top: 14px;
    }

    .detail-file-row {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 7px;
      color: #c3c2b7;
      font-size: 12px;
      line-height: 1.35;
    }

    .detail-file-name {
      min-width: 0;
      flex: 1 1 auto;
      overflow-wrap: anywhere;
    }

    .detail-loc {
      flex: 0 0 auto;
      color: #898781;
    }

    .changed-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      background: #d03b3b;
      border-radius: 50%;
    }

    .detail-empty {
      color: #898781;
      font-size: 12px;
    }

    #open-files {
      margin-top: 14px;
      padding: 6px 9px;
      color: #c3c2b7;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div id="graph"></div>
  <div id="labels"></div>
  <div id="context-pill" hidden>
    <svg id="context-pill-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path id="context-pill-icon-branch" d="M9.5 3.25a2.25 2.25 0 1 1 3 2.122V6A2.5 2.5 0 0 1 10 8.5H6a1 1 0 0 0-1 1v1.128a2.251 2.251 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.5 0v1.836A2.493 2.493 0 0 1 6 7h4a1 1 0 0 0 1-1v-.628A2.25 2.25 0 0 1 9.5 3.25Zm-6 0a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Zm8.25-.75a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5ZM4.25 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"/>
      <path id="context-pill-icon-pr" hidden d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/>
    </svg>
    <span id="context-pill-branch"></span>
    <a id="context-pill-pr" target="_blank" rel="noopener" hidden></a>
    <span id="context-pill-arrow" hidden>→</span>
    <span id="context-pill-base" hidden></span>
  </div>
  <section id="panel">
    <div id="view-toggle" aria-label="Graph view">
      <button class="view-button active" type="button" data-view="compact">Compact</button>
      <button class="view-button" type="button" data-view="files">Advanced</button>
    </div>
    <div id="compactness-setting">
      <div id="compactness-label">compactness</div>
      <input id="compactness" type="range" min="1" max="3" step="1" aria-label="Compactness">
      <div id="compactness-levels">
        <span>roots</span>
        <span>groups</span>
        <span>dirs</span>
      </div>
    </div>
    <div id="panel-title">__SLOPMAP_TITLE__</div>
    <div id="meta"></div>
    <div id="legend"></div>
    <div id="files-controls" hidden>
      <input id="search" type="search" placeholder="filter files…" aria-label="Filter files">
      <div id="filters">
        <label id="impact-option" class="checkbox-label">
          <input id="impact-only" type="checkbox" checked>
          <span>impact only</span>
        </label>
        <label class="checkbox-label">
          <input id="hide-isolated" type="checkbox">
          <span>hide isolated</span>
        </label>
      </div>
    </div>
    <div id="theme-setting">
      <div id="theme-label">background</div>
      <div id="theme-toggle" aria-label="Background theme">
        <button class="view-button" type="button" data-theme="plain">Plain</button>
        <button class="view-button" type="button" data-theme="galaxy">Galaxy</button>
      </div>
    </div>
    <div id="section-filter" hidden>
      <span id="section-filter-label"></span>
      <button id="clear-section-filter" type="button" aria-label="Clear section filter">×</button>
    </div>
    <div id="hint">drag rotate · scroll zoom · click ball = details</div>
  </section>
  <section id="detail-panel" hidden>
    <div id="detail-header">
      <div id="detail-title"></div>
      <button id="detail-close" type="button" aria-label="Close section details">×</button>
    </div>
    <div id="detail-meta"></div>
    <div id="detail-body"></div>
    <button id="open-files" type="button">open in Files</button>
  </section>
  <script>__SLOPMAP_LIB__</script>
  <script>
    const payload = __SLOPMAP_DATA__;
    const diffMode = payload.graph.stats.changedCount > 0;
    const STATUS_COLORS = { changed: '#d03b3b', dependent: '#ec835a', dependency: '#fab219' };
    const GROUP_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
    const MUTED_COLOR = '#898781';
    const filterState = { searchTerm: '' };
    let currentView = 'compact';
    const readStoredCompactness = () => {
      try {
        const storedLevel = Number(localStorage.getItem('slopmap-compactness'));
        return [1, 2, 3].includes(storedLevel) ? storedLevel : 2;
      } catch (storageError) {
        return 2;
      }
    };
    let compactnessLevel = readStoredCompactness();
    let aggregateFilter = null;
    let selectedSection = null;
    let selectedNode = null;
    let simulationNodes = [];
    let labelFrameId = null;
    let initialEngineStopPending = true;
    const groupColors = new Map(
      payload.graph.groups
        .slice(0, GROUP_COLORS.length)
        .map((group, slotIndex) => [group.name, GROUP_COLORS[slotIndex]])
    );
    const contextPillElement = document.getElementById('context-pill');
    const contextPillBranchElement = document.getElementById('context-pill-branch');
    const contextPillPrElement = document.getElementById('context-pill-pr');
    const contextPillArrowElement = document.getElementById('context-pill-arrow');
    const contextPillBaseElement = document.getElementById('context-pill-base');
    const contextPillBranchIconPath = document.getElementById('context-pill-icon-branch');
    const contextPillPrIconPath = document.getElementById('context-pill-icon-pr');
    const metaElement = document.getElementById('meta');
    const legendElement = document.getElementById('legend');
    const labelsElement = document.getElementById('labels');
    const compactnessSettingElement = document.getElementById('compactness-setting');
    const compactnessInput = document.getElementById('compactness');
    const filesControlsElement = document.getElementById('files-controls');
    const searchInput = document.getElementById('search');
    const impactOption = document.getElementById('impact-option');
    const impactOnlyInput = document.getElementById('impact-only');
    const hideIsolatedInput = document.getElementById('hide-isolated');
    const sectionFilterElement = document.getElementById('section-filter');
    const sectionFilterLabelElement = document.getElementById('section-filter-label');
    const clearSectionFilterButton = document.getElementById('clear-section-filter');
    const hintElement = document.getElementById('hint');
    const detailPanelElement = document.getElementById('detail-panel');
    const detailTitleElement = document.getElementById('detail-title');
    const detailMetaElement = document.getElementById('detail-meta');
    const detailBodyElement = document.getElementById('detail-body');
    const detailCloseButton = document.getElementById('detail-close');
    const openFilesButton = document.getElementById('open-files');
    const viewButtons = [...document.querySelectorAll('#view-toggle .view-button')];
    const themeButtons = [...document.querySelectorAll('#theme-toggle .view-button')];
    const sectionLabelElements = new Map();
    const isAggregatedView = () => currentView === 'compact';
    const activeAggregate = () => payload.graph.levels[
      { 1: 'roots', 2: 'groups', 3: 'dirs' }[compactnessLevel]
    ];

    const renderContext = () => {
      const context = payload.context;
      if (context === null || context === undefined) return;

      const hasBranch = Boolean(context.branch);
      if (hasBranch) {
        contextPillBranchElement.textContent = String(context.branch);
      }
      contextPillBranchElement.hidden = !hasBranch;

      const pullRequest = context.pullRequest;
      const hasPullRequest = pullRequest !== null && pullRequest !== undefined;
      if (hasPullRequest) {
        contextPillPrElement.textContent = `#${pullRequest.number}`;
        contextPillPrElement.setAttribute('title', String(pullRequest.title));
        contextPillPrElement.setAttribute('href', String(pullRequest.url));
        contextPillPrElement.hidden = false;
      }
      contextPillBranchIconPath.toggleAttribute('hidden', hasPullRequest);
      contextPillPrIconPath.toggleAttribute('hidden', !hasPullRequest);

      if (context.baseRef) {
        contextPillBaseElement.textContent = String(context.baseRef);
        contextPillArrowElement.hidden = false;
        contextPillBaseElement.hidden = false;
      }

      contextPillElement.hidden = !hasBranch && !hasPullRequest;
    };

    const appendLegendRow = (color, label, count) => {
      const rowElement = document.createElement('div');
      const dotElement = document.createElement('span');
      const labelElement = document.createElement('span');
      const countElement = document.createElement('span');
      rowElement.className = 'legend-row';
      dotElement.className = 'legend-dot';
      dotElement.style.background = color;
      labelElement.textContent = label;
      countElement.className = 'legend-count';
      countElement.textContent = String(count);
      rowElement.append(dotElement, labelElement, countElement);
      legendElement.append(rowElement);
    };

    const renderLegend = () => {
      if (diffMode) {
        const untouchedCount = payload.graph.nodes.filter((node) => node.status === 'normal').length;
        appendLegendRow(STATUS_COLORS.changed, 'Changed', payload.graph.stats.changedCount);
        appendLegendRow(STATUS_COLORS.dependent, 'Blast radius (depends on change)', payload.graph.stats.dependentCount);
        appendLegendRow(STATUS_COLORS.dependency, 'Change depends on', payload.graph.stats.dependencyCount);
        appendLegendRow(MUTED_COLOR, 'Untouched', untouchedCount);
        return;
      }

      for (const [slotIndex, group] of payload.graph.groups.slice(0, GROUP_COLORS.length).entries()) {
        appendLegendRow(GROUP_COLORS[slotIndex], group.name, group.count);
      }
      if (payload.graph.groups.length > GROUP_COLORS.length) {
        const otherCount = payload.graph.groups
          .slice(GROUP_COLORS.length)
          .reduce((totalCount, group) => totalCount + group.count, 0);
        appendLegendRow(MUTED_COLOR, 'other', `(${otherCount})`);
      }
    };

    const idOf = (endpoint) => typeof endpoint === 'object' ? endpoint.id : endpoint;

    const blendTowardWhite = (hexColor, blendRatio) => {
      const blendChannel = (channelOffset) => {
        const channelValue = parseInt(hexColor.slice(channelOffset, channelOffset + 2), 16);
        return Math.round(channelValue + (255 - channelValue) * blendRatio)
          .toString(16)
          .padStart(2, '0');
      };
      return `#${blendChannel(1)}${blendChannel(3)}${blendChannel(5)}`;
    };

    const nodeColorFor = (node) => {
      let baseColor;
      if (isAggregatedView()) {
        baseColor = diffMode
          ? (node.status === 'normal' ? 'rgba(137,135,129,0.5)' : STATUS_COLORS[node.status])
          : (groupColors.get(node.group) || MUTED_COLOR);
      } else if (filterState.searchTerm && node.id.toLowerCase().includes(filterState.searchTerm)) {
        baseColor = '#ffffff';
      } else if (node.status !== 'normal') {
        baseColor = STATUS_COLORS[node.status];
      } else if (diffMode) {
        baseColor = 'rgba(137,135,129,0.35)';
      } else {
        baseColor = groupColors.get(node.group) || MUTED_COLOR;
      }
      if (node !== selectedNode) return baseColor;
      return baseColor.startsWith('#')
        ? blendTowardWhite(baseColor, 0.4)
        : blendTowardWhite('#898781', 0.4);
    };

    const nodeLabelFor = (node) => {
      if (isAggregatedView()) {
        return `${node.id} · ${node.fileCount} files` +
          (node.changedCount > 0 ? ` · ${node.changedCount} changed` : '');
      }
      return `${node.id} · ${node.loc} loc` +
        (node.status !== 'normal' ? ` · ${node.status}` : '');
    };

    const nodeValueFor = (node) => {
      if (!isAggregatedView()) return Math.max(1, Math.min(14, node.loc / 60));
      if (compactnessLevel === 1) {
        return Math.max(10, Math.min(90, Math.sqrt(node.fileCount) * 2.4));
      }
      if (compactnessLevel === 2) {
        return Math.max(8, Math.min(70, Math.sqrt(node.fileCount) * 2.0));
      }
      return Math.max(4, Math.min(40, node.fileCount));
    };

    const linkWidthFor = (link) => {
      if (link.kind === undefined) return 1;
      return link.kind === 'imports' ? Math.min(4, Math.log2(link.weight + 1)) : 0.2;
    };

    const linkColorFor = (link) => {
      if (link.kind === 'orbit') return 'rgba(255,255,255,0.08)';
      if (link.kind === 'imports') return link.hot ? '#ec835a' : '#4a4a47';
      return link.hot ? '#ec835a' : '#4a4a47';
    };

    const particleCountFor = (link) => {
      if (link.kind !== undefined) return link.kind === 'imports' && link.hot ? 2 : 0;
      return link.hot ? 2 : 0;
    };

    const applyFilters = () => {
      let nodes = payload.graph.nodes;
      if (aggregateFilter !== null) {
        nodes = nodes.filter((node) => {
          if (aggregateFilter.mode === 'root') return node.rootGroup === aggregateFilter.value;
          if (aggregateFilter.mode === 'group') return node.group === aggregateFilter.value;
          return node.section === aggregateFilter.value;
        });
      }
      if (diffMode && impactOnlyInput.checked) {
        nodes = nodes.filter((node) => node.status !== 'normal');
      }
      let keptNodeIds = new Set(nodes.map((node) => node.id));
      let links = payload.graph.links.filter(
        (link) => keptNodeIds.has(idOf(link.source)) && keptNodeIds.has(idOf(link.target))
      );
      if (hideIsolatedInput.checked) {
        const linkedNodeIds = new Set();
        for (const link of links) {
          linkedNodeIds.add(idOf(link.source));
          linkedNodeIds.add(idOf(link.target));
        }
        nodes = nodes.filter((node) => linkedNodeIds.has(node.id));
        keptNodeIds = new Set(nodes.map((node) => node.id));
        links = links.filter(
          (link) => keptNodeIds.has(idOf(link.source)) && keptNodeIds.has(idOf(link.target))
        );
      }
      return { nodes, links };
    };

    const refreshFilesView = () => {
      if (currentView === 'files') graphInstance.graphData(applyFilters());
    };

    const renderAggregateFilter = () => {
      sectionFilterElement.hidden = aggregateFilter === null;
      sectionFilterLabelElement.textContent = aggregateFilter === null ? '' : aggregateFilter.value;
    };

    const closeDetailPanel = () => {
      selectedSection = null;
      detailPanelElement.hidden = true;
    };

    const appendChangedFile = (filePath) => {
      const rowElement = document.createElement('div');
      const dotElement = document.createElement('span');
      const fileElement = document.createElement('span');
      rowElement.className = 'detail-file-row';
      dotElement.className = 'changed-dot';
      fileElement.className = 'detail-file-name';
      fileElement.textContent = filePath;
      rowElement.append(dotElement, fileElement);
      detailBodyElement.append(rowElement);
    };

    const appendSectionFile = (node) => {
      const rowElement = document.createElement('div');
      const fileElement = document.createElement('span');
      const locElement = document.createElement('span');
      rowElement.className = 'detail-file-row';
      fileElement.className = 'detail-file-name';
      fileElement.textContent = node.id;
      locElement.className = 'detail-loc';
      locElement.textContent = `${node.loc} loc`;
      rowElement.append(fileElement, locElement);
      detailBodyElement.append(rowElement);
    };

    const appendDetailEmptyState = (message) => {
      const emptyElement = document.createElement('div');
      emptyElement.className = 'detail-empty';
      emptyElement.textContent = message;
      detailBodyElement.append(emptyElement);
    };

    const openSectionDetail = (section) => {
      selectedSection = section;
      detailTitleElement.textContent = section.id;
      detailMetaElement.textContent = `${section.fileCount} files · ${section.loc} loc` +
        (diffMode ? ` · ${section.changedCount} changed` : '');
      detailBodyElement.replaceChildren();
      if (diffMode) {
        if (section.changedFiles.length === 0) {
          appendDetailEmptyState('no changed files here');
        } else {
          for (const filePath of section.changedFiles) appendChangedFile(filePath);
        }
      } else {
        const sectionFiles = payload.graph.nodes
          .filter((node) => {
            if (compactnessLevel === 1) return node.rootGroup === section.id;
            if (compactnessLevel === 2) return node.group === section.id;
            return node.section === section.id;
          })
          .sort((firstNode, secondNode) => secondNode.loc - firstNode.loc)
          .slice(0, 10);
        if (sectionFiles.length === 0) {
          appendDetailEmptyState('no files here');
        } else {
          for (const node of sectionFiles) appendSectionFile(node);
        }
      }
      detailPanelElement.hidden = false;
    };

    const rebuildSectionLabels = () => {
      sectionLabelElements.clear();
      labelsElement.replaceChildren();
      for (const section of activeAggregate().sections) {
        const labelElement = document.createElement('div');
        const isHub = compactnessLevel !== 3 || section.id === section.group;
        labelElement.className = isHub
          ? 'section-label section-label-hub'
          : 'section-label section-label-subsection';
        labelElement.textContent = isHub ? section.id : section.id.split('/').at(-1);
        labelElement.style.visibility = 'hidden';
        sectionLabelElements.set(section.id, labelElement);
        labelsElement.append(labelElement);
      }
    };

    const renderSectionLabels = () => {
      if (!isAggregatedView()) {
        labelFrameId = null;
        return;
      }
      for (const section of activeAggregate().sections) {
        const labelElement = sectionLabelElements.get(section.id);
        if (!labelElement) continue;
        if (
          section.x === undefined ||
          section.y === undefined ||
          section.z === undefined
        ) {
          labelElement.style.visibility = 'hidden';
          continue;
        }
        const screenCoordinates = graphInstance.graph2ScreenCoords(section.x, section.y, section.z);
        labelElement.style.visibility = 'visible';
        labelElement.style.transform =
          `translate(-50%, 8px) translate(${screenCoordinates.x}px, ${screenCoordinates.y}px)`;
      }
      labelFrameId = requestAnimationFrame(renderSectionLabels);
    };

    const updateSectionLabelLoop = () => {
      if (isAggregatedView() && labelFrameId === null) {
        labelFrameId = requestAnimationFrame(renderSectionLabels);
      } else if (!isAggregatedView() && labelFrameId !== null) {
        cancelAnimationFrame(labelFrameId);
        labelFrameId = null;
      }
    };

    const readStoredTheme = () => {
      try {
        return localStorage.getItem('slopmap-theme');
      } catch (storageError) {
        return null;
      }
    };
    let backgroundTheme = readStoredTheme() === 'plain' ? 'plain' : 'galaxy';
    const starsCanvas = document.getElementById('stars');
    const starsContext = starsCanvas.getContext('2d');
    const baseCanvas = document.createElement('canvas');
    const baseContext = baseCanvas.getContext('2d');
    const deepCanvas = document.createElement('canvas');
    const deepContext = deepCanvas.getContext('2d');
    const vignetteCanvas = document.createElement('canvas');
    const vignetteContext = vignetteCanvas.getContext('2d');
    let starsFrameId = null;
    let starFieldWidth = window.innerWidth;
    let starFieldHeight = window.innerHeight;
    let accumulatedPanX = 0;
    let previousAzimuth = null;
    const STAR_DEPTH_BUCKETS = [0.4, 0.7, 1.0];
    const pickDepthFactor = () =>
      STAR_DEPTH_BUCKETS[Math.floor(Math.random() * STAR_DEPTH_BUCKETS.length)];

    const pickStarColor = () => {
      const colorRoll = Math.random();
      if (colorRoll < 0.6) return '#ffffff';
      if (colorRoll < 0.85) return '#aecbff';
      return '#ffd9a0';
    };

    const stars = Array.from({ length: 340 }, () => ({
      xPosition: Math.random() * starFieldWidth,
      yPosition: Math.random() * starFieldHeight,
      radius: 0.4 + Math.random() * 1.2,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.5 + Math.random() * 1.5,
      driftX: (Math.random() - 0.5) * 0.04,
      driftY: (Math.random() - 0.5) * 0.04,
      color: pickStarColor(),
      isBright: false,
      depthFactor: pickDepthFactor(),
    })).concat(Array.from({ length: 8 }, () => ({
      xPosition: Math.random() * starFieldWidth,
      yPosition: Math.random() * starFieldHeight,
      radius: 1.8 + Math.random() * 0.8,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.5 + Math.random() * 1.5,
      driftX: (Math.random() - 0.5) * 0.04,
      driftY: (Math.random() - 0.5) * 0.04,
      color: pickStarColor(),
      isBright: true,
      depthFactor: 1.0,
    })));

    const drawBaseLayer = () => {
      const pixelRatio = window.devicePixelRatio || 1;
      baseCanvas.width = starFieldWidth * pixelRatio;
      baseCanvas.height = starFieldHeight * pixelRatio;
      baseContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      const maxDimension = Math.max(starFieldWidth, starFieldHeight);
      const baseGradient = baseContext.createRadialGradient(
        starFieldWidth * 0.6, starFieldHeight * 0.38, 0,
        starFieldWidth * 0.6, starFieldHeight * 0.38, maxDimension * 1.2
      );
      baseGradient.addColorStop(0, '#0d1120');
      baseGradient.addColorStop(0.55, '#070911');
      baseGradient.addColorStop(1, '#04050a');
      baseContext.fillStyle = baseGradient;
      baseContext.fillRect(0, 0, starFieldWidth, starFieldHeight);
    };

    const drawDeepLayer = () => {
      const pixelRatio = window.devicePixelRatio || 1;
      const deepHeight = starFieldHeight * 1.6;
      deepCanvas.width = starFieldWidth * pixelRatio;
      deepCanvas.height = deepHeight * pixelRatio;
      deepContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      deepContext.clearRect(0, 0, starFieldWidth, deepHeight);
      const maxDimension = Math.max(starFieldWidth, deepHeight);
      const primaryBandHeight = starFieldHeight * 0.35;
      const primaryBandTop = deepHeight * 0.38 - primaryBandHeight / 2;
      const primaryBandGradient = deepContext.createLinearGradient(
        0, primaryBandTop, 0, primaryBandTop + primaryBandHeight
      );
      primaryBandGradient.addColorStop(0, 'rgba(201,215,255,0)');
      primaryBandGradient.addColorStop(0.5, 'rgba(201,215,255,0.05)');
      primaryBandGradient.addColorStop(1, 'rgba(201,215,255,0)');
      deepContext.fillStyle = primaryBandGradient;
      deepContext.fillRect(0, primaryBandTop, starFieldWidth, primaryBandHeight);
      const secondaryBandHeight = starFieldHeight * 0.18;
      const secondaryBandTop = deepHeight * 0.55 - secondaryBandHeight / 2;
      const secondaryBandGradient = deepContext.createLinearGradient(
        0, secondaryBandTop, 0, secondaryBandTop + secondaryBandHeight
      );
      secondaryBandGradient.addColorStop(0, 'rgba(201,215,255,0)');
      secondaryBandGradient.addColorStop(0.5, 'rgba(201,215,255,0.03)');
      secondaryBandGradient.addColorStop(1, 'rgba(201,215,255,0)');
      deepContext.fillStyle = secondaryBandGradient;
      deepContext.fillRect(0, secondaryBandTop, starFieldWidth, secondaryBandHeight);
      const nebulaBlobs = [
        { colorChannels: '144,133,233', alpha: 0.1, centerX: starFieldWidth * 0.25, centerY: deepHeight * 0.3, blobRadius: maxDimension * 0.38 },
        { colorChannels: '57,135,229', alpha: 0.08, centerX: starFieldWidth * 0.72, centerY: deepHeight * 0.58, blobRadius: maxDimension * 0.32 },
        { colorChannels: '213,81,129', alpha: 0.06, centerX: starFieldWidth * 0.48, centerY: deepHeight * 0.85, blobRadius: maxDimension * 0.26 },
        { colorChannels: '236,131,90', alpha: 0.035, centerX: starFieldWidth * 0.85, centerY: deepHeight * 0.18, blobRadius: maxDimension * 0.18 },
      ];
      for (const blob of nebulaBlobs) {
        for (const wrapOffset of [-starFieldWidth, 0, starFieldWidth]) {
          const wrappedCenterX = blob.centerX + wrapOffset;
          const gradient = deepContext.createRadialGradient(
            wrappedCenterX, blob.centerY, 0,
            wrappedCenterX, blob.centerY, blob.blobRadius
          );
          gradient.addColorStop(0, `rgba(${blob.colorChannels},${blob.alpha})`);
          gradient.addColorStop(0.45, `rgba(${blob.colorChannels},${blob.alpha})`);
          gradient.addColorStop(1, `rgba(${blob.colorChannels},0)`);
          deepContext.fillStyle = gradient;
          deepContext.fillRect(0, 0, starFieldWidth, deepHeight);
        }
      }
    };

    const drawVignetteLayer = () => {
      const pixelRatio = window.devicePixelRatio || 1;
      vignetteCanvas.width = starFieldWidth * pixelRatio;
      vignetteCanvas.height = starFieldHeight * pixelRatio;
      vignetteContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      vignetteContext.clearRect(0, 0, starFieldWidth, starFieldHeight);
      const maxDimension = Math.max(starFieldWidth, starFieldHeight);
      const vignetteGradient = vignetteContext.createRadialGradient(
        starFieldWidth / 2, starFieldHeight / 2, 0,
        starFieldWidth / 2, starFieldHeight / 2, maxDimension
      );
      vignetteGradient.addColorStop(0, 'rgba(0,0,0,0)');
      vignetteGradient.addColorStop(0.6, 'rgba(0,0,0,0)');
      vignetteGradient.addColorStop(1, 'rgba(0,0,0,0.35)');
      vignetteContext.fillStyle = vignetteGradient;
      vignetteContext.fillRect(0, 0, starFieldWidth, starFieldHeight);
    };

    const resizeStarsCanvas = () => {
      const pixelRatio = window.devicePixelRatio || 1;
      starFieldWidth = window.innerWidth;
      starFieldHeight = window.innerHeight;
      starsCanvas.width = starFieldWidth * pixelRatio;
      starsCanvas.height = starFieldHeight * pixelRatio;
      starsContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      drawBaseLayer();
      drawDeepLayer();
      drawVignetteLayer();
    };

    const renderStars = (timestamp) => {
      if (backgroundTheme !== 'galaxy') {
        starsFrameId = null;
        return;
      }
      let panY = 0;
      if (typeof graphInstance !== 'undefined' && graphInstance.camera()) {
        const cameraPosition = graphInstance.camera().position;
        const azimuth = Math.atan2(cameraPosition.x, cameraPosition.z);
        const elevation = Math.atan2(
          cameraPosition.y,
          Math.hypot(cameraPosition.x, cameraPosition.z)
        );
        if (previousAzimuth === null) {
          previousAzimuth = azimuth;
        } else {
          let azimuthDelta = azimuth - previousAzimuth;
          if (azimuthDelta > Math.PI) azimuthDelta -= 2 * Math.PI;
          if (azimuthDelta < -Math.PI) azimuthDelta += 2 * Math.PI;
          accumulatedPanX += (azimuthDelta / (2 * Math.PI)) * starFieldWidth * 2;
          previousAzimuth = azimuth;
        }
        panY = (elevation / (Math.PI / 2)) * starFieldHeight * 0.5;
      }
      starsContext.clearRect(0, 0, starFieldWidth, starFieldHeight);
      starsContext.drawImage(baseCanvas, 0, 0, starFieldWidth, starFieldHeight);
      const deepHeight = starFieldHeight * 1.6;
      const deepOffsetX = Math.round(
        (((accumulatedPanX * 0.25) % starFieldWidth) + starFieldWidth) % starFieldWidth
      );
      const deepOffsetY = Math.round(-0.3 * starFieldHeight + panY * 0.25);
      starsContext.drawImage(deepCanvas, deepOffsetX, deepOffsetY, starFieldWidth, deepHeight);
      starsContext.drawImage(
        deepCanvas, deepOffsetX - starFieldWidth, deepOffsetY, starFieldWidth, deepHeight
      );
      for (const star of stars) {
        star.xPosition += star.driftX;
        star.yPosition += star.driftY;
        if (star.xPosition < 0) star.xPosition += starFieldWidth;
        if (star.xPosition > starFieldWidth) star.xPosition -= starFieldWidth;
        if (star.yPosition < 0) star.yPosition += starFieldHeight;
        if (star.yPosition > starFieldHeight) star.yPosition -= starFieldHeight;
        const screenX =
          (((star.xPosition + accumulatedPanX * star.depthFactor) % starFieldWidth) +
            starFieldWidth) % starFieldWidth;
        const screenY =
          (((star.yPosition + panY * star.depthFactor) % starFieldHeight) +
            starFieldHeight) % starFieldHeight;
        starsContext.globalAlpha =
          0.25 + 0.55 * Math.abs(Math.sin(star.twinklePhase + timestamp * 0.001 * star.twinkleSpeed));
        starsContext.fillStyle = star.color;
        if (star.isBright) {
          starsContext.shadowBlur = 9;
          starsContext.shadowColor = star.color;
        }
        starsContext.beginPath();
        starsContext.arc(screenX, screenY, star.radius, 0, Math.PI * 2);
        starsContext.fill();
        if (star.isBright) {
          starsContext.shadowBlur = 0;
        }
      }
      starsContext.globalAlpha = 1;
      starsContext.drawImage(vignetteCanvas, 0, 0, starFieldWidth, starFieldHeight);
      starsFrameId = requestAnimationFrame(renderStars);
    };

    const updateStarsLoop = () => {
      if (backgroundTheme === 'galaxy' && starsFrameId === null) {
        starsFrameId = requestAnimationFrame(renderStars);
      } else if (backgroundTheme !== 'galaxy' && starsFrameId !== null) {
        cancelAnimationFrame(starsFrameId);
        starsFrameId = null;
      }
    };

    const setBackgroundTheme = (theme) => {
      backgroundTheme = theme === 'plain' ? 'plain' : 'galaxy';
      try {
        localStorage.setItem('slopmap-theme', backgroundTheme);
      } catch (storageError) {}
      starsCanvas.style.display = backgroundTheme === 'galaxy' ? 'block' : 'none';
      updateStarsLoop();
      for (const themeButton of themeButtons) {
        themeButton.classList.toggle('active', themeButton.dataset.theme === backgroundTheme);
      }
    };

    const showView = (view) => {
      currentView = view;
      selectedNode = null;
      closeDetailPanel();
      for (const viewButton of viewButtons) {
        viewButton.classList.toggle('active', viewButton.dataset.view === view);
      }
      labelsElement.hidden = !isAggregatedView();
      compactnessSettingElement.hidden = !isAggregatedView();
      filesControlsElement.hidden = isAggregatedView();
      hintElement.textContent = isAggregatedView()
        ? 'drag rotate · scroll zoom · click ball = details'
        : 'drag rotate · scroll zoom · click node = focus';
      if (isAggregatedView()) {
        const aggregate = activeAggregate();
        rebuildSectionLabels();
        graphInstance.graphData({
          nodes: aggregate.sections,
          links: aggregate.links,
        });
        graphInstance.d3Force('charge').strength(-160);
        graphInstance.d3Force('link').distance(
          compactnessLevel === 1
            ? 120
            : compactnessLevel === 2
              ? 100
              : (link) => link.kind === 'orbit' ? 70 : 110
        );
      } else {
        graphInstance.graphData(applyFilters());
        graphInstance.d3Force('charge').strength(-45);
        graphInstance.d3Force('link').distance(35);
      }
      updateSectionLabelLoop();
      graphInstance.zoomToFit(600);
    };

    const clickRepelForce = (alpha) => {
      if (selectedNode === null) return;
      const repelRadius = isAggregatedView() ? 180 : 90;
      for (const simulationNode of simulationNodes) {
        if (simulationNode === selectedNode) continue;
        const deltaX = simulationNode.x - selectedNode.x;
        const deltaY = simulationNode.y - selectedNode.y;
        const deltaZ = (simulationNode.z ?? 0) - (selectedNode.z ?? 0);
        const distance = Math.max(Math.hypot(deltaX, deltaY, deltaZ), 1);
        if (distance < repelRadius) {
          const pushFactor = ((repelRadius - distance) / distance) * alpha * 0.6;
          simulationNode.vx += deltaX * pushFactor;
          simulationNode.vy += deltaY * pushFactor;
          simulationNode.vz += deltaZ * pushFactor;
        }
      }
    };
    clickRepelForce.initialize = (nodes) => { simulationNodes = nodes; };

    const handleNodeClick = (node) => {
      const isDeselecting = selectedNode === node;
      selectedNode = isDeselecting ? null : node;
      if (!isDeselecting) {
        if (isAggregatedView()) {
          openSectionDetail(node);
        } else {
          const distance = 140;
          const length = Math.hypot(node.x, node.y, node.z) || 1;
          const ratio = 1 + distance / length;
          graphInstance.cameraPosition(
            { x: node.x * ratio, y: node.y * ratio, z: node.z * ratio },
            node,
            800
          );
        }
      }
      graphInstance.d3ReheatSimulation();
      graphInstance.nodeColor(nodeColorFor);
    };

    const handleBackgroundClick = () => {
      if (selectedNode === null) return;
      selectedNode = null;
      graphInstance.d3ReheatSimulation();
      graphInstance.nodeColor(nodeColorFor);
    };

    metaElement.textContent = `${payload.graph.stats.fileCount} files · ${payload.graph.stats.linkCount} imports` +
      (diffMode
        ? ` · ${payload.graph.stats.changedCount} changed · ${payload.graph.stats.dependentCount} blast`
        : '');
    renderContext();
    impactOption.hidden = !diffMode;
    renderLegend();

    const graphInstance = ForceGraph3D()(document.getElementById('graph'))
      .backgroundColor('rgba(26,26,25,0)')
      .nodeLabel(nodeLabelFor)
      .nodeVal(nodeValueFor)
      .nodeColor(nodeColorFor)
      .linkWidth(linkWidthFor)
      .linkColor(linkColorFor)
      .linkOpacity(0.35)
      .linkDirectionalParticles(particleCountFor)
      .linkDirectionalParticleWidth(1.4)
      .onNodeClick(handleNodeClick)
      .onBackgroundClick(handleBackgroundClick)
      .onEngineStop(() => {
        if (!initialEngineStopPending) return;
        initialEngineStopPending = false;
        graphInstance.zoomToFit(600);
      });

    graphInstance.d3Force('clickRepel', clickRepelForce);

    for (const viewButton of viewButtons) {
      viewButton.addEventListener('click', () => showView(viewButton.dataset.view));
    }
    compactnessInput.value = String(compactnessLevel);
    compactnessInput.addEventListener('input', () => {
      compactnessLevel = Number(compactnessInput.value);
      try {
        localStorage.setItem('slopmap-compactness', String(compactnessLevel));
      } catch (storageError) {}
      showView('compact');
    });
    for (const themeButton of themeButtons) {
      themeButton.addEventListener('click', () => setBackgroundTheme(themeButton.dataset.theme));
    }
    searchInput.addEventListener('input', () => {
      filterState.searchTerm = searchInput.value.toLowerCase();
      graphInstance.nodeColor(nodeColorFor);
    });
    impactOnlyInput.addEventListener('change', refreshFilesView);
    hideIsolatedInput.addEventListener('change', refreshFilesView);
    clearSectionFilterButton.addEventListener('click', () => {
      aggregateFilter = null;
      renderAggregateFilter();
      refreshFilesView();
    });
    detailCloseButton.addEventListener('click', closeDetailPanel);
    openFilesButton.addEventListener('click', () => {
      if (selectedSection === null) return;
      aggregateFilter = {
        mode: compactnessLevel === 1 ? 'root' : compactnessLevel === 2 ? 'group' : 'section',
        value: selectedSection.id,
      };
      renderAggregateFilter();
      closeDetailPanel();
      showView('files');
    });

    resizeStarsCanvas();
    window.addEventListener('resize', resizeStarsCanvas);

    renderAggregateFilter();
    setBackgroundTheme(backgroundTheme);
    showView(currentView);
  </script>
</body>
</html>
