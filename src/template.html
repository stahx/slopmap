<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__SLOPMAP_TITLE__</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #e8e6df;
      background: radial-gradient(circle at 20% 24%, rgba(110,120,200,.16), transparent 45%), radial-gradient(circle at 74% 70%, rgba(120,70,130,.14), transparent 50%), #12142a;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }

    #graph,
    #graph2d {
      position: fixed;
      top: 64px;
      right: 452px;
      bottom: 0;
      left: 60px;
      z-index: 1;
    }

    #graph[hidden] {
      display: none;
    }

    #graph2d[hidden] {
      display: none;
    }

    #labels {
      position: fixed;
      top: 64px;
      right: 452px;
      bottom: 0;
      left: 60px;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .section-label {
      position: absolute;
      top: 0;
      left: 0;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,.9);
      will-change: transform;
    }

    button,
    input {
      font-family: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 1px solid #f08a4b;
      outline-offset: 2px;
    }

    .section-label-hub {
      color: #fff;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
    }

    .section-label-subsection {
      color: rgba(255,255,255,.72);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 500;
    }

    .ratio-bar {
      display: flex;
      height: 6px;
      min-width: 0;
      flex: 1 1 auto;
      gap: 2px;
      overflow: hidden;
      border-radius: 3px;
    }

    .ratio-additions,
    .ratio-deletions {
      min-width: 2px;
      opacity: .85;
    }

    .ratio-additions {
      background: #6fbf8b;
    }

    .ratio-deletions {
      background: #e8564a;
    }

    #distribution {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #distribution-bar {
      display: flex;
      height: 7px;
      gap: 2px;
      overflow: hidden;
      border-radius: 4px;
    }

    .distribution-segment {
      min-width: 2px;
    }

    .distribution-untouched {
      opacity: .45;
    }

    #legend {
      display: grid;
      gap: 7px;
      margin: 0;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      color: rgba(232,230,223,.8);
      font-size: 12.5px;
      line-height: 1.3;
    }

    .legend-row-untouched {
      opacity: .5;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .legend-count {
      color: #e8e6df;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
    }

    #meta {
      margin: 0;
      color: rgba(232,230,223,.35);
      font-size: 11px;
      line-height: 1.35;
    }

    #compactness-setting {
      margin: 0;
    }

    #compactness-label {
      display: flex;
      justify-content: space-between;
      color: rgba(232,230,223,.45);
      font-size: 11px;
    }

    #compactness-level {
      font-family: var(--font-mono);
      font-size: 10.5px;
    }

    #compactness {
      width: 100%;
      margin: 6px 0 1px;
      accent-color: #f08a4b;
    }

    #files-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #search {
      width: 100%;
      margin: 0;
      padding: 8px 10px;
      color: #e8e6df;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 7px;
      outline: none;
      font-family: var(--font-mono);
      font-size: 11.5px;
    }

    #search::placeholder {
      color: rgba(232,230,223,.35);
    }

    #search:focus {
      border-color: rgba(240,138,75,.55);
    }

    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 0;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(232,230,223,.7);
      font-size: 12px;
      line-height: 1.3;
      cursor: pointer;
    }

    .checkbox-label input {
      margin: 0;
      accent-color: #f08a4b;
    }

    #section-filter {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      gap: 6px;
      margin: 0;
      padding: 4px 7px;
      color: rgba(232,230,223,.7);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    #clear-section-filter {
      padding: 0;
      color: rgba(232,230,223,.4);
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    #detail-header-block {
      flex: 0 0 auto;
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    #detail-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #detail-status-dot {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      border-radius: 50%;
    }

    #detail-title {
      min-width: 0;
      flex: 1 1 auto;
      color: #e8e6df;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    #detail-close {
      flex: 0 0 auto;
      margin: 0;
      padding: 0;
      color: rgba(232,230,223,.4);
      background: transparent;
      border: 0;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    #detail-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 16px;
    }

    .detail-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-stat-value {
      color: #e8e6df;
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 600;
      line-height: 1;
    }

    .detail-stat-label {
      color: rgba(232,230,223,.4);
      font-size: 10.5px;
      white-space: nowrap;
    }

    .detail-file-row {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
      padding: 9px 18px;
      color: #e8e6df;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.35;
    }

    .detail-status-badge {
      display: inline-flex;
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 600;
    }

    .detail-status-M {
      color: #f2b52e;
      background: rgba(242,181,46,.18);
    }

    .detail-status-A {
      color: #6fbf8b;
      background: rgba(111,191,139,.16);
    }

    .detail-status-D {
      color: #e8564a;
      background: rgba(232,86,74,.16);
    }

    .detail-status-R {
      color: #8b93dc;
      background: rgba(140,150,220,.16);
    }

    .detail-file-name {
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
      color: #e8e6df;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-file-deleted {
      color: rgba(232,230,223,.55);
      text-decoration: line-through;
    }

    .detail-change-count,
    .detail-loc {
      flex: 0 0 auto;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
    }

    .detail-additions {
      color: #6fbf8b;
    }

    .detail-deletions {
      color: #e8564a;
    }

    .detail-change-zero,
    .detail-loc {
      color: rgba(232,230,223,.3);
    }

    .detail-ratio-additions,
    .detail-ratio-deletions {
      min-width: 1px;
    }

    .detail-ratio-additions {
      background: #6fbf8b;
    }

    .detail-ratio-deletions {
      background: #e8564a;
    }

    .detail-empty {
      padding: 9px 18px 16px;
      color: rgba(232,230,223,.35);
      font-size: 12px;
    }

    #detail-footer {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
      padding: 14px 18px;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    #open-pr,
    #open-files {
      display: inline-flex;
      flex: 1 1 0;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 9px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
    }

    #open-pr {
      color: #14162a;
      background: #f08a4b;
      border: 1px solid #f08a4b;
    }

    #open-files {
      color: rgba(232,230,223,.75);
      background: transparent;
      border: 1px solid rgba(255,255,255,.12);
      font-weight: 500;
    }

    #icon-rail {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 4;
      display: flex;
      width: 60px;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 0;
      background: rgba(14,16,32,.95);
      border-right: 1px solid rgba(255,255,255,.07);
    }

    #logo-tile {
      display: flex;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      color: #14162a;
      background: #f08a4b;
      border-radius: 9px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
    }

    #rail-top-spacer {
      height: 10px;
      flex: 0 0 auto;
    }

    #rail-flex-spacer,
    #header-flex-spacer {
      flex: 1 1 auto;
    }

    .rail-button {
      display: inline-flex;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: rgba(232,230,223,.45);
      background: transparent;
      border: 0;
      border-radius: 9px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .rail-button:hover,
    .rail-button.active {
      color: #e8e6df;
      background: rgba(255,255,255,.1);
    }

    #help-popover {
      position: absolute;
      bottom: 56px;
      left: 48px;
      display: flex;
      width: 230px;
      flex-direction: column;
      gap: 7px;
      padding: 12px 14px;
      color: rgba(232,230,223,.72);
      background: rgba(16,18,38,.96);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      box-shadow: 0 12px 34px rgba(0,0,0,.35);
      font-size: 12px;
      line-height: 1.3;
      cursor: pointer;
    }

    #help-popover[hidden] {
      display: none;
    }

    #top-header {
      position: fixed;
      top: 0;
      right: 452px;
      left: 60px;
      z-index: 3;
      display: flex;
      height: 64px;
      align-items: center;
      gap: 14px;
      padding: 0 22px;
      background: rgba(14,16,32,.6);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: blur(8px);
    }

    #header-context {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 4px;
    }

    #header-repository {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    #repo-name {
      min-width: 0;
      overflow: hidden;
      color: #e8e6df;
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 600;
      text-overflow: ellipsis;
    }

    #repo-separator {
      color: rgba(232,230,223,.28);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    #context-branch {
      min-width: 0;
      overflow: hidden;
      color: #f2b52e;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      text-overflow: ellipsis;
    }

    #context-base-wrap {
      min-width: 0;
      overflow: hidden;
      color: rgba(232,230,223,.3);
      font-family: var(--font-mono);
      font-size: 11.5px;
      text-overflow: ellipsis;
    }

    #context-base-wrap[hidden] {
      display: none;
    }

    #meta {
      color: rgba(232,230,223,.35);
      font-size: 11px;
      line-height: 1.2;
    }

    #context-pr {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      color: inherit;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 9px;
      text-decoration: none;
    }

    #context-pr[hidden] {
      display: none;
    }

    #context-pr-number {
      color: #e8e6df;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }

    #context-pr-state {
      padding: 2px 5px;
      color: #6fbf8b;
      border: 1px solid rgba(111,191,139,.4);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 9.5px;
    }

    #context-pr-arrow {
      color: #f08a4b;
    }

    #context-totals {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: rgba(255,255,255,.05);
      border-radius: 9px;
    }

    #context-totals[hidden] {
      display: none;
    }

    #total-additions,
    #total-deletions {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }

    #total-additions {
      color: #6fbf8b;
    }

    #total-deletions {
      color: #e8564a;
    }

    #totals-ratio {
      width: 70px;
      flex: 0 0 auto;
    }

    #controls-pill {
      position: fixed;
      bottom: 22px;
      left: 84px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: rgba(16,18,38,.85);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    #compactness-setting {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
    }

    #compactness-setting[hidden] {
      display: none;
    }

    #compactness-label {
      display: inline;
      color: rgba(232,230,223,.4);
      font-size: 11px;
    }

    #compactness {
      width: 150px;
      margin: 0;
      accent-color: #f08a4b;
    }

    #compactness-level {
      color: rgba(232,230,223,.45);
      font-family: var(--font-mono);
      font-size: 10.5px;
    }

    .controls-divider {
      width: 1px;
      height: 18px;
      flex: 0 0 auto;
      background: rgba(255,255,255,.09);
    }

    #theme-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      padding: 2px;
      background: rgba(255,255,255,.05);
      border-radius: 7px;
    }

    .theme-button {
      padding: 4px 7px;
      color: rgba(232,230,223,.45);
      background: transparent;
      border: 0;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .theme-button.active {
      color: #e8e6df;
      background: rgba(255,255,255,.1);
    }

    #files-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #files-controls[hidden] {
      display: none;
    }

    #search {
      width: 160px;
      padding: 6px 8px;
    }

    #filters {
      flex-wrap: nowrap;
      gap: 10px;
    }

    .checkbox-label {
      font-size: 11px;
      white-space: nowrap;
    }

    #impact-option[hidden],
    #section-filter[hidden] {
      display: none;
    }

    #section-filter {
      align-self: auto;
      white-space: nowrap;
    }

    #inspector {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      display: flex;
      width: 452px;
      flex-direction: column;
      color: #e8e6df;
      background: rgba(14,16,32,.97);
      border-left: 1px solid rgba(255,255,255,.08);
    }

    #inspector-overview,
    #inspector-detail {
      min-height: 0;
      flex: 1 1 auto;
    }

    #inspector-overview {
      display: flex;
      flex-direction: column;
    }

    #inspector-overview[hidden],
    #inspector-detail[hidden] {
      display: none;
    }

    #overview-header {
      flex: 0 0 auto;
      padding: 18px 20px;
      color: #e8e6df;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-family: var(--font-mono);
      font-size: 15.5px;
      font-weight: 600;
    }

    #overview-body {
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 18px 20px;
      scrollbar-width: thin;
    }

    #distribution {
      gap: 12px;
    }

    #distribution-bar[hidden] {
      display: none;
    }

    #overview-meta {
      color: rgba(232,230,223,.35);
      font-size: 11px;
      line-height: 1.35;
    }

    #changed-sections-block {
      margin-top: 30px;
    }

    #changed-sections-block[hidden] {
      display: none;
    }

    #changed-sections-label {
      margin-bottom: 8px;
      color: rgba(232,230,223,.35);
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: .08em;
    }

    #changed-sections {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .changed-section-row {
      display: grid;
      width: 100%;
      grid-template-columns: 8px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      color: rgba(232,230,223,.78);
      background: transparent;
      border: 0;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
    }

    .changed-section-row:hover {
      color: #e8e6df;
      background: rgba(255,255,255,.05);
    }

    .changed-section-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .changed-section-id {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .changed-section-count {
      color: #e8e6df;
      font-size: 12px;
    }

    #inspector-detail {
      display: flex;
      flex-direction: column;
    }

    #detail-header-block {
      padding: 18px 20px 16px;
      border-bottom: 0;
    }

    #detail-status-dot {
      width: 11px;
      height: 11px;
    }

    #detail-title {
      font-size: 15.5px;
    }

    #detail-close {
      width: 28px;
      height: 28px;
      font-size: 18px;
    }

    #detail-stats {
      flex-wrap: nowrap;
      gap: 10px;
      margin-top: 18px;
    }

    .detail-stat {
      min-width: 0;
      flex: 1 1 0;
      gap: 5px;
      padding: 11px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 9px;
    }

    .detail-stat-changed {
      background: rgba(232,86,74,.1);
      border-color: rgba(232,86,74,.22);
    }

    .detail-stat-blast {
      background: rgba(240,138,75,.1);
      border-color: rgba(240,138,75,.22);
    }

    .detail-stat-value {
      font-size: 18px;
      line-height: 1.1;
    }

    .detail-stat-changed .detail-stat-value {
      color: #e8564a;
    }

    .detail-stat-blast .detail-stat-value {
      color: #f08a4b;
    }

    .detail-stat-label {
      font-size: 10.5px;
    }

    #inspector-tabs {
      display: flex;
      flex: 0 0 auto;
      gap: 20px;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    #inspector-tabs[hidden] {
      display: none;
    }

    .inspector-tab {
      margin: 0 0 -1px;
      padding: 10px 0 11px;
      color: rgba(232,230,223,.45);
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .inspector-tab.active {
      color: #e8e6df;

<body>
  <canvas id="stars"></canvas>

    <button id="help-button" class="rail-button" type="button" aria-label="Help">?</button>

  <header id="top-header">
    <div id="header-context">
      <div id="header-repository">

        <button id="copy-paths" type="button">Copy paths</button>
        <button id="open-files" type="button">Isolate blast</button>
      </div>
    </div>
  </aside>
  <script>__SLOPMAP_LIB__</script>
  <script>__SLOPMAP_LIB_2D__</script>
  <script>
    const payload = __SLOPMAP_DATA__;
    const diffMode = (payload.changes?.totals ?? null) !== null;
    const STATUS_COLORS = { changed: '#e8564a', dependent: '#f08a4b', dependency: '#f2b52e' };
    const GROUP_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
    const MUTED_COLOR = '#8b8fa3';
    const AGGREGATE_PUSH_RADIUS = 180;
    const filterState = { searchTerm: '' };
    const idOf = (endpoint) => typeof endpoint === 'object' ? endpoint.id : endpoint;
    let currentView = 'compact';
    const readStoredViewDimension = () => {
      try {
        const storedDimension = localStorage.getItem('slopmap-dimension');
        return ['3d', '2d'].includes(storedDimension) ? storedDimension : '3d';
      } catch (storageError) {
        return '3d';
      }
    };
    let viewDimension = readStoredViewDimension();
    const readStoredCompactness = () => {
      try {
        const storedLevel = Number(localStorage.getItem('slopmap-compactness'));
        return [1, 2, 3].includes(storedLevel) ? storedLevel : 2;
      } catch (storageError) {
        return 2;
      }
    };
    let compactnessLevel = readStoredCompactness();
    let aggregateFilter = null;
    let selectedSection = null;
    let selectedNode = null;
    let selectedInspectorTab = 'files';
    let displacedOriginals = new Map();
    let labelFrameId = null;
    let pendingFitAfterStop = false;
    const groupColors = new Map(
      payload.graph.groups
        .slice(0, GROUP_COLORS.length)
        .map((group, slotIndex) => [group.name, GROUP_COLORS[slotIndex]])
    );
    const graphNodesById = new Map(payload.graph.nodes.map((node) => [node.id, node]));
    const importerCountsByTarget = new Map();
    const importedTargetsBySource = new Map();
    for (const link of payload.graph.links) {
      const sourceId = idOf(link.source);
      const targetId = idOf(link.target);
      importerCountsByTarget.set(targetId, (importerCountsByTarget.get(targetId) || 0) + 1);
      if (!importedTargetsBySource.has(sourceId)) importedTargetsBySource.set(sourceId, new Set());
      importedTargetsBySource.get(sourceId).add(targetId);
    }
    const repoNameElement = document.getElementById('repo-name');
    const contextBranchElement = document.getElementById('context-branch');
    const contextBaseWrapElement = document.getElementById('context-base-wrap');
    const contextBaseElement = document.getElementById('context-base');
    const contextPrElement = document.getElementById('context-pr');
    const contextPrNumberElement = document.getElementById('context-pr-number');
    const contextPrStateElement = document.getElementById('context-pr-state');
    const contextTotalsElement = document.getElementById('context-totals');
    const totalAdditionsElement = document.getElementById('total-additions');
    const totalDeletionsElement = document.getElementById('total-deletions');
    const totalAdditionsBarElement = document.getElementById('total-additions-bar');
    const totalDeletionsBarElement = document.getElementById('total-deletions-bar');
    const distributionBarElement = document.getElementById('distribution-bar');
    const metaElement = document.getElementById('meta');
    const overviewMetaElement = document.getElementById('overview-meta');
    const legendElement = document.getElementById('legend');
    const changedSectionsBlockElement = document.getElementById('changed-sections-block');
    const changedSectionsElement = document.getElementById('changed-sections');
    const labelsElement = document.getElementById('labels');
    const graphElement = document.getElementById('graph');
    const graph2dElement = document.getElementById('graph2d');
    const compactnessSettingElement = document.getElementById('compactness-setting');
    const compactnessLevelElement = document.getElementById('compactness-level');
    const compactnessInput = document.getElementById('compactness');
    const filesControlsElement = document.getElementById('files-controls');
    const searchInput = document.getElementById('search');
    const impactOption = document.getElementById('impact-option');
    const impactOnlyInput = document.getElementById('impact-only');
    const hideIsolatedInput = document.getElementById('hide-isolated');
    const sectionFilterElement = document.getElementById('section-filter');
    const sectionFilterLabelElement = document.getElementById('section-filter-label');
    const clearSectionFilterButton = document.getElementById('clear-section-filter');
    const helpPopoverElement = document.getElementById('help-popover');
    const helpButton = document.getElementById('help-button');
    const dimensionButton = document.getElementById('dimension-button');
    const inspectorOverviewElement = document.getElementById('inspector-overview');
    const inspectorDetailElement = document.getElementById('inspector-detail');
    const detailStatusDotElement = document.getElementById('detail-status-dot');
    const detailTitleElement = document.getElementById('detail-title');
    const detailStatsElement = document.getElementById('detail-stats');
    const inspectorTabsElement = document.getElementById('inspector-tabs');
    const detailContentElement = document.getElementById('detail-content');
    const detailCloseButton = document.getElementById('detail-close');
    const openPrElement = document.getElementById('open-pr');
    const copyPathsButton = document.getElementById('copy-paths');
    const openFilesButton = document.getElementById('open-files');
    const viewButtons = [...document.querySelectorAll('.rail-button[data-view]')];
    const themeButtons = [...document.querySelectorAll('#theme-toggle .theme-button')];
    const sectionLabelElements = new Map();
    const isAggregatedView = () => currentView === 'compact';
    const activeAggregate = () => payload.graph.levels[
      { 1: 'roots', 2: 'groups', 3: 'dirs' }[compactnessLevel]
    ];

    const relativeTime = (dateValue) => {
      const elapsedSeconds = Math.max(0, Math.floor((Date.now() - new Date(dateValue).getTime()) / 1000));
      if (elapsedSeconds < 60) return `${elapsedSeconds}s ago`;
      if (elapsedSeconds < 3600) return `${Math.floor(elapsedSeconds / 60)}m ago`;
      return `${Math.floor(elapsedSeconds / 3600)}h ago`;
    };

    const renderContext = () => {
      const context = payload.context;
      repoNameElement.textContent = payload.repoName;
      const analyzedText = context?.generatedAt ? ` · analyzed ${relativeTime(context.generatedAt)}` : '';
      metaElement.textContent =
        `${payload.graph.stats.fileCount} files · ${payload.graph.stats.linkCount} imports${analyzedText}`;
      contextBranchElement.textContent = context?.branch ? String(context.branch) : '';

      const pullRequest = context?.pullRequest;
      const hasPullRequest = pullRequest !== null && pullRequest !== undefined;
      if (hasPullRequest) {
        contextPrNumberElement.textContent = `#${pullRequest.number}`;
        contextPrStateElement.textContent = String(pullRequest.state || '').toUpperCase();
        contextPrElement.setAttribute('title', String(pullRequest.title));
        contextPrElement.setAttribute('href', String(pullRequest.url));
        contextPrElement.hidden = false;
      }

      if (context?.baseRef) {
        contextBaseElement.textContent = String(context.baseRef);
        contextBaseWrapElement.hidden = false;
      }

      const totals = payload.changes?.totals ?? null;
      if (totals !== null) {
        totalAdditionsElement.textContent = `+${totals.additions}`;
        totalDeletionsElement.textContent = `−${totals.deletions}`;
        totalAdditionsBarElement.style.flex = String(Math.max(totals.additions, 1));
        totalDeletionsBarElement.style.flex = String(Math.max(totals.deletions, 1));
        contextTotalsElement.hidden = false;
      }
    };

    const appendLegendRow = (color, label, count) => {
      const rowElement = document.createElement('div');
      const dotElement = document.createElement('span');
      const labelElement = document.createElement('span');
      const countElement = document.createElement('span');
      rowElement.className = 'legend-row';
      dotElement.className = 'legend-dot';
      dotElement.style.background = color;
      labelElement.textContent = label;
      countElement.className = 'legend-count';
      countElement.textContent = String(count);
      if (label === 'Untouched') rowElement.classList.add('legend-row-untouched');
      rowElement.append(dotElement, labelElement, countElement);
      legendElement.append(rowElement);
    };

    const appendDistributionSegment = (color, count, className = '') => {
      const segmentElement = document.createElement('span');
      segmentElement.className = `distribution-segment ${className}`;
      segmentElement.style.background = color;
      segmentElement.style.flex = String(count);
      distributionBarElement.append(segmentElement);
    };

    const renderLegend = () => {
      if (diffMode) {
        const untouchedCount = payload.graph.nodes.filter((node) => node.status === 'normal').length;
        appendLegendRow(STATUS_COLORS.changed, 'Changed', payload.graph.stats.changedCount);
        appendLegendRow(STATUS_COLORS.dependent, 'Blast radius', payload.graph.stats.dependentCount);
        appendLegendRow(STATUS_COLORS.dependency, 'Change depends on', payload.graph.stats.dependencyCount);
        appendLegendRow(MUTED_COLOR, 'Untouched', untouchedCount);
        appendDistributionSegment(STATUS_COLORS.changed, payload.graph.stats.changedCount);
        appendDistributionSegment(STATUS_COLORS.dependent, payload.graph.stats.dependentCount);
        appendDistributionSegment(STATUS_COLORS.dependency, payload.graph.stats.dependencyCount);
        appendDistributionSegment(MUTED_COLOR, untouchedCount, 'distribution-untouched');
        distributionBarElement.hidden = false;
        return;
      }

      for (const [slotIndex, group] of payload.graph.groups.slice(0, GROUP_COLORS.length).entries()) {
        appendLegendRow(GROUP_COLORS[slotIndex], group.name, group.count);
      }
      if (payload.graph.groups.length > GROUP_COLORS.length) {
        const otherCount = payload.graph.groups
          .slice(GROUP_COLORS.length)
          .reduce((totalCount, group) => totalCount + group.count, 0);
        appendLegendRow(MUTED_COLOR, 'other', `(${otherCount})`);
      }
    };

    const blendTowardWhite = (hexColor, blendRatio) => {
      const blendChannel = (channelOffset) => {
        const channelValue = parseInt(hexColor.slice(channelOffset, channelOffset + 2), 16);
        return Math.round(channelValue + (255 - channelValue) * blendRatio)
          .toString(16)
          .padStart(2, '0');
      };
      return `#${blendChannel(1)}${blendChannel(3)}${blendChannel(5)}`;
    };

    const nodeColorFor = (node) => {
      let baseColor;
      if (isAggregatedView()) {
        baseColor = diffMode
          ? (node.status === 'normal' ? 'rgba(139,143,163,.5)' : STATUS_COLORS[node.status])
          : (groupColors.get(node.group) || MUTED_COLOR);
      } else if (filterState.searchTerm && node.id.toLowerCase().includes(filterState.searchTerm)) {
        baseColor = '#ffffff';
      } else if (node.status !== 'normal') {
        baseColor = STATUS_COLORS[node.status];
      } else if (diffMode) {
        baseColor = 'rgba(139,143,163,.35)';
      } else {
        baseColor = groupColors.get(node.group) || MUTED_COLOR;
      }
      if (node !== selectedNode) return baseColor;
      return baseColor.startsWith('#')
        ? blendTowardWhite(baseColor, 0.4)
        : blendTowardWhite(MUTED_COLOR, 0.4);
    };

    const nodeLabelFor = (node) => {
      if (isAggregatedView()) {
        return `${node.id} · ${node.fileCount} files` +
          (node.changedCount > 0 ? ` · ${node.changedCount} changed` : '');
      }
      return `${node.id} · ${node.loc} loc` +
        (node.status !== 'normal' ? ` · ${node.status}` : '');
    };

    const nodeValueFor = (node) => {
      if (!isAggregatedView()) return Math.max(1, Math.min(14, node.loc / 60));
      if (compactnessLevel === 1) {
        return Math.max(10, Math.min(90, Math.sqrt(node.fileCount) * 2.4));
      }
      if (compactnessLevel === 2) {
        return Math.max(8, Math.min(70, Math.sqrt(node.fileCount) * 2.0));
      }
      return Math.max(4, Math.min(40, node.fileCount));
    };

    const linkWidthFor = (link) => {
      if (link.kind === undefined) return 1;
      return link.kind === 'imports' ? Math.min(4, Math.log2(link.weight + 1)) : 0.2;
    };

    const linkColorFor = (link) => {
      if (link.kind === 'orbit') return 'rgba(255,255,255,0.08)';
      if (link.kind === 'imports') return link.hot ? '#f08a4b' : '#3a3d55';
      return link.hot ? '#f08a4b' : '#3a3d55';
    };

    const particleCountFor = (link) => {
      if (link.kind !== undefined) return link.kind === 'imports' && link.hot ? 2 : 0;
      return link.hot ? 2 : 0;
    };

    const applyFilters = () => {
      let nodes = payload.graph.nodes;
      if (aggregateFilter !== null) {
        nodes = nodes.filter((node) => {
          if (aggregateFilter.mode === 'root') return node.rootGroup === aggregateFilter.value;
          if (aggregateFilter.mode === 'group') return node.group === aggregateFilter.value;
          return node.section === aggregateFilter.value;
        });
      }
      if (diffMode && impactOnlyInput.checked) {
        nodes = nodes.filter((node) => node.status !== 'normal');
      }
      let keptNodeIds = new Set(nodes.map((node) => node.id));
      let links = payload.graph.links.filter(
        (link) => keptNodeIds.has(idOf(link.source)) && keptNodeIds.has(idOf(link.target))
      );
      if (hideIsolatedInput.checked) {
        const linkedNodeIds = new Set();
        for (const link of links) {
          linkedNodeIds.add(idOf(link.source));
          linkedNodeIds.add(idOf(link.target));
        }
        nodes = nodes.filter((node) => linkedNodeIds.has(node.id));
        keptNodeIds = new Set(nodes.map((node) => node.id));
        links = links.filter(
          (link) => keptNodeIds.has(idOf(link.source)) && keptNodeIds.has(idOf(link.target))
        );
      }
      return { nodes, links };
    };

    const refreshFilesView = () => {
      if (currentView === 'files') activeGraph().graphData(applyFilters());
    };

    const renderAggregateFilter = () => {
      sectionFilterElement.hidden = aggregateFilter === null;
      sectionFilterLabelElement.textContent = aggregateFilter === null ? '' : aggregateFilter.value;
    };

    const appendDetailStat = (value, label, statClass = '') => {
      const statElement = document.createElement('div');
      const valueElement = document.createElement('span');
      const labelElement = document.createElement('span');
      statElement.className = `detail-stat ${statClass}`;
      valueElement.className = 'detail-stat-value';
      valueElement.textContent = String(value);
      labelElement.className = 'detail-stat-label';
      labelElement.textContent = label;
      statElement.append(valueElement, labelElement);
      detailStatsElement.append(statElement);
    };

    const changeMatchesSection = (changeFile, section) => {
      if (compactnessLevel === 1) return changeFile.rootGroup === section.id;
      if (compactnessLevel === 2) return changeFile.group === section.id;
      return changeFile.section === section.id;
    };

    const displayPathFor = (filePath, sectionId) => {
      const sectionPrefix = `${sectionId}/`;
      return filePath.startsWith(sectionPrefix) ? filePath.slice(sectionPrefix.length) : filePath;
    };

    const nodeMatchesSection = (node, section) => {
      if (compactnessLevel === 1) return node.rootGroup === section.id;
      if (compactnessLevel === 2) return node.group === section.id;
      return node.section === section.id;
    };

    const changedFilesFor = (section) => payload.changes.files.filter(
      (changeFile) => changeMatchesSection(changeFile, section)
    );

    const sectionFilesFor = (section) => payload.graph.nodes.filter(
      (node) => nodeMatchesSection(node, section)
    );

    const importedFilesFor = (section) => {
      const importedIds = new Set();
      for (const changeFile of changedFilesFor(section)) {
        for (const targetId of importedTargetsBySource.get(changeFile.path) || []) {
          const targetNode = graphNodesById.get(targetId);
          if (targetNode !== undefined && nodeMatchesSection(targetNode, section)) continue;
          importedIds.add(targetId);
        }
      }
      return [...importedIds].sort((firstId, secondId) => firstId.localeCompare(secondId));
    };

    const appendChangedFile = (changeFile, section) => {
      const cardElement = document.createElement('div');
      const primaryElement = document.createElement('div');
      const badgeElement = document.createElement('span');
      const fileElement = document.createElement('span');
      const additionsElement = document.createElement('span');
      const deletionsElement = document.createElement('span');
      const ratioElement = document.createElement('div');
      const additionsBarElement = document.createElement('span');
      const deletionsBarElement = document.createElement('span');
      const remainderBarElement = document.createElement('span');
      const metaElement = document.createElement('div');
      const importerCount = importerCountsByTarget.get(changeFile.path) || 0;
      cardElement.className = 'detail-file-card';
      primaryElement.className = 'detail-file-primary';
      badgeElement.className = `detail-status-badge detail-status-${changeFile.status}`;
      badgeElement.textContent = changeFile.status;
      fileElement.className = 'detail-file-name';
      if (changeFile.status === 'D') fileElement.classList.add('detail-file-deleted');
      fileElement.textContent = displayPathFor(changeFile.path, section.id);
      additionsElement.className = changeFile.additions === 0
        ? 'detail-change-count detail-change-zero'
        : 'detail-change-count detail-additions';
      additionsElement.textContent = `+${changeFile.additions}`;
      deletionsElement.className = changeFile.deletions === 0
        ? 'detail-change-count detail-change-zero'
        : 'detail-change-count detail-deletions';
      deletionsElement.textContent = `−${changeFile.deletions}`;
      ratioElement.className = 'detail-card-ratio';
      additionsBarElement.className = 'detail-ratio-additions';
      additionsBarElement.style.flex = String(Math.max(changeFile.additions, 1));
      deletionsBarElement.className = 'detail-ratio-deletions';
      deletionsBarElement.style.flex = String(Math.max(changeFile.deletions, 1));
      remainderBarElement.className = 'detail-ratio-remainder';
      remainderBarElement.style.flex = String(
        Math.max(changeFile.additions + changeFile.deletions, 1)
      );
      ratioElement.append(additionsBarElement, deletionsBarElement, remainderBarElement);
      metaElement.className = 'detail-file-meta';
      if (changeFile.status === 'D') {
        metaElement.textContent = importerCount > 0
          ? `deleted · ${importerCount} files still import this`
          : 'deleted';
        if (importerCount > 0) metaElement.classList.add('detail-file-warning');
      } else {
        metaElement.textContent = `imported by ${importerCount} files`;
      }
      primaryElement.append(
        badgeElement,
        fileElement,
        additionsElement,
        deletionsElement
      );
      cardElement.append(primaryElement, ratioElement, metaElement);
      detailContentElement.append(cardElement);
    };

    const appendSectionFile = (node) => {
      const rowElement = document.createElement('div');
      const fileElement = document.createElement('span');
      const locElement = document.createElement('span');
      rowElement.className = 'detail-file-row';
      fileElement.className = 'detail-file-name';
      fileElement.textContent = node.id;
      locElement.className = 'detail-loc';
      locElement.textContent = `${node.loc} loc`;
      rowElement.append(fileElement, locElement);
      detailContentElement.append(rowElement);
    };

    const appendDetailEmptyState = (message) => {
      const emptyElement = document.createElement('div');
      emptyElement.className = 'detail-empty';
      emptyElement.textContent = message;
      detailContentElement.append(emptyElement);
    };

    const appendPathRow = (filePath, dotClass) => {
      const rowElement = document.createElement('div');
      const dotElement = document.createElement('span');
      const pathElement = document.createElement('span');
      rowElement.className = 'path-row';
      dotElement.className = `path-dot ${dotClass}`;
      pathElement.textContent = filePath;
      rowElement.append(dotElement, pathElement);
      detailContentElement.append(rowElement);
    };

    const renderOverview = () => {
      inspectorOverviewElement.hidden = false;
      inspectorDetailElement.hidden = true;
      changedSectionsElement.replaceChildren();
      changedSectionsBlockElement.hidden = !diffMode;
      if (!diffMode) return;
      const changedSections = activeAggregate().sections
        .filter((section) => section.changedCount > 0)
        .sort((firstSection, secondSection) =>
          secondSection.changedCount - firstSection.changedCount ||
          firstSection.id.localeCompare(secondSection.id)
        );
      for (const section of changedSections) {
        const rowButton = document.createElement('button');
        const dotElement = document.createElement('span');
        const idElement = document.createElement('span');
        const countElement = document.createElement('span');
        rowButton.className = 'changed-section-row';
        rowButton.type = 'button';
        dotElement.className = 'changed-section-dot';
        dotElement.style.background = STATUS_COLORS[section.status] || MUTED_COLOR;
        idElement.className = 'changed-section-id';
        idElement.textContent = section.id;
        countElement.className = 'changed-section-count';
        countElement.textContent = String(section.changedCount);
        rowButton.append(dotElement, idElement, countElement);
        rowButton.addEventListener('click', () => selectSection(section));
        changedSectionsElement.append(rowButton);
      }
    };

    const renderDiffTabContent = (section) => {
      detailContentElement.replaceChildren();
      if (selectedInspectorTab === 'files') {
        const changedFiles = changedFilesFor(section);
        if (changedFiles.length === 0) {
          appendDetailEmptyState('no changed files here');
        } else {
          for (const changeFile of changedFiles) appendChangedFile(changeFile, section);
        }
        return;
      }
      if (selectedInspectorTab === 'dependents') {
        const downstreamFiles = Array.isArray(section.downstreamFiles)
          ? section.downstreamFiles
          : [];
        if (downstreamFiles.length === 0) {
          appendDetailEmptyState('no downstream files');
        } else {
          for (const filePath of downstreamFiles) {
            appendPathRow(filePath, 'path-dot-dependent');
          }
        }
        const hiddenCount = Math.max((section.downstreamTotal || 0) - downstreamFiles.length, 0);
        if (hiddenCount > 0) {
          const footerElement = document.createElement('div');
          footerElement.className = 'path-footer';
          footerElement.textContent = `+ ${hiddenCount} more`;
          detailContentElement.append(footerElement);
        }
        return;
      }
      const importedFiles = importedFilesFor(section);
      if (importedFiles.length === 0) {
        appendDetailEmptyState('no cross-section imports');
      } else {
        for (const filePath of importedFiles) appendPathRow(filePath, 'path-dot-import');
      }
    };

    const renderInspectorTabs = (section) => {
      const tabDefinitions = [
        { id: 'files', label: 'Files', count: changedFilesFor(section).length },
        { id: 'dependents', label: 'Dependents', count: section.downstreamTotal || 0 },
        { id: 'imports', label: 'Imports', count: importedFilesFor(section).length },
      ];
      inspectorTabsElement.replaceChildren();
      inspectorTabsElement.hidden = false;
      for (const tabDefinition of tabDefinitions) {
        const tabButton = document.createElement('button');
        const countElement = document.createElement('span');
        tabButton.className = 'inspector-tab';
        tabButton.type = 'button';
        tabButton.classList.toggle('active', tabDefinition.id === selectedInspectorTab);
        tabButton.append(`${tabDefinition.label} `);
        countElement.className = 'inspector-tab-count';
        countElement.textContent = String(tabDefinition.count);
        tabButton.append(countElement);
        tabButton.addEventListener('click', () => {
          selectedInspectorTab = tabDefinition.id;
          renderInspector();
        });
        inspectorTabsElement.append(tabButton);
      }
    };

    const renderInspectorDetail = (section) => {
      inspectorOverviewElement.hidden = true;
      inspectorDetailElement.hidden = false;
      detailTitleElement.textContent = section.id;
      const statusColor = STATUS_COLORS[section.status] || MUTED_COLOR;
      detailStatusDotElement.style.background = statusColor;
      detailStatusDotElement.style.boxShadow = `0 0 12px 3px ${statusColor}80`;
      detailStatsElement.replaceChildren();
      if (diffMode) {
        appendDetailStat(section.changedCount, 'files changed', 'detail-stat-changed');
        appendDetailStat(section.downstreamTotal || 0, 'blast radius', 'detail-stat-blast');
        appendDetailStat(section.additions + section.deletions, 'lines touched');
        renderInspectorTabs(section);
        renderDiffTabContent(section);
      } else {
        appendDetailStat(section.fileCount, 'files');
        appendDetailStat(section.loc, 'loc');
        inspectorTabsElement.hidden = true;
        inspectorTabsElement.replaceChildren();
        detailContentElement.replaceChildren();
        const sectionFiles = sectionFilesFor(section)
          .sort((firstNode, secondNode) => secondNode.loc - firstNode.loc)
          .slice(0, 10);
        if (sectionFiles.length === 0) {
          appendDetailEmptyState('no files here');
        } else {
          for (const node of sectionFiles) appendSectionFile(node);
        }
      }
      const pullRequest = payload.context?.pullRequest;
      if (pullRequest) {
        openPrElement.textContent = `Review in PR #${pullRequest.number} ↗`;
        openPrElement.setAttribute('href', String(pullRequest.url));
        openPrElement.hidden = false;
      } else {
        openPrElement.hidden = true;
      }
    };

    const renderInspector = () => {
      if (selectedSection === null) {
        renderOverview();
      } else {
        renderInspectorDetail(selectedSection);
      }
    };

    const rebuildSectionLabels = () => {
      sectionLabelElements.clear();
      labelsElement.replaceChildren();
      for (const section of activeAggregate().sections) {
        const labelElement = document.createElement('div');
        const isHub = compactnessLevel !== 3 || section.id === section.group;
        labelElement.className = isHub
          ? 'section-label section-label-hub'
          : 'section-label section-label-subsection';
        labelElement.textContent = isHub ? section.id : section.id.split('/').at(-1);
        labelElement.style.visibility = 'hidden';
        sectionLabelElements.set(section.id, labelElement);
        labelsElement.append(labelElement);
      }
    };

    const renderSectionLabels = () => {
      if (!isAggregatedView() || viewDimension !== '3d') {
        labelFrameId = null;
        return;
      }
      for (const section of activeAggregate().sections) {
        const labelElement = sectionLabelElements.get(section.id);
        if (!labelElement) continue;
        if (
          section.x === undefined ||
          section.y === undefined ||
          section.z === undefined
        ) {
          labelElement.style.visibility = 'hidden';
          continue;
        }
        const screenCoordinates = graphInstance.graph2ScreenCoords(section.x, section.y, section.z);
        labelElement.style.visibility = 'visible';
        labelElement.style.transform =
          `translate(-50%, 8px) translate(${screenCoordinates.x}px, ${screenCoordinates.y}px)`;
      }
      labelFrameId = requestAnimationFrame(renderSectionLabels);
    };

    const updateSectionLabelLoop = () => {
      if (isAggregatedView() && viewDimension === '3d' && labelFrameId === null) {
        labelFrameId = requestAnimationFrame(renderSectionLabels);
      } else if ((!isAggregatedView() || viewDimension !== '3d') && labelFrameId !== null) {
        cancelAnimationFrame(labelFrameId);
        labelFrameId = null;
      }
    };

    const readStoredTheme = () => {
      try {
        return localStorage.getItem('slopmap-theme');
      } catch (storageError) {
        return null;
      }
    };
    let backgroundTheme = readStoredTheme() === 'plain' ? 'plain' : 'galaxy';
    const starsCanvas = document.getElementById('stars');
    const starsContext = starsCanvas.getContext('2d');
    const baseCanvas = document.createElement('canvas');
    const baseContext = baseCanvas.getContext('2d');
    const deepCanvas = document.createElement('canvas');
    const deepContext = deepCanvas.getContext('2d');
    const vignetteCanvas = document.createElement('canvas');
    const vignetteContext = vignetteCanvas.getContext('2d');
    let starsFrameId = null;
    let starFieldWidth = window.innerWidth;
    let starFieldHeight = window.innerHeight;
    let accumulatedPanX = 0;
    let previousAzimuth = null;
    let pan2dX = 0;
    let pan2dY = 0;
    const STAR_DEPTH_BUCKETS = [0.4, 0.7, 1.0];
    const pickDepthFactor = () =>
      STAR_DEPTH_BUCKETS[Math.floor(Math.random() * STAR_DEPTH_BUCKETS.length)];

    const pickStarColor = () => {
      const colorRoll = Math.random();
      if (colorRoll < 0.6) return '#ffffff';
      if (colorRoll < 0.85) return '#aecbff';
      return '#ffd9a0';
    };

    const stars = Array.from({ length: 340 }, () => ({
      xPosition: Math.random() * starFieldWidth,
      yPosition: Math.random() * starFieldHeight,
      radius: 0.4 + Math.random() * 1.2,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.5 + Math.random() * 1.5,
      driftX: (Math.random() - 0.5) * 0.04,
      driftY: (Math.random() - 0.5) * 0.04,
      color: pickStarColor(),
      isBright: false,
      depthFactor: pickDepthFactor(),
    })).concat(Array.from({ length: 8 }, () => ({
      xPosition: Math.random() * starFieldWidth,
      yPosition: Math.random() * starFieldHeight,
      radius: 1.8 + Math.random() * 0.8,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.5 + Math.random() * 1.5,
      driftX: (Math.random() - 0.5) * 0.04,
      driftY: (Math.random() - 0.5) * 0.04,
      color: pickStarColor(),
      isBright: true,
      depthFactor: 1.0,
    })));

    const drawBaseLayer = () => {
      const pixelRatio = window.devicePixelRatio || 1;
      baseCanvas.width = starFieldWidth * pixelRatio;
      baseCanvas.height = starFieldHeight * pixelRatio;
      baseContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      baseContext.fillStyle = '#12142a';
      baseContext.fillRect(0, 0, starFieldWidth, starFieldHeight);
      const upperCenterX = starFieldWidth * 0.2;
      const upperCenterY = starFieldHeight * 0.24;
      const upperRadius = Math.hypot(
        Math.max(upperCenterX, starFieldWidth - upperCenterX),
        Math.max(upperCenterY, starFieldHeight - upperCenterY)
      );
      const upperTint = baseContext.createRadialGradient(
        upperCenterX, upperCenterY, 0,
        upperCenterX, upperCenterY, upperRadius
      );
      upperTint.addColorStop(0, 'rgba(110,120,200,.16)');
      upperTint.addColorStop(0.45, 'rgba(110,120,200,0)');
      upperTint.addColorStop(1, 'rgba(110,120,200,0)');
      baseContext.fillStyle = upperTint;
      baseContext.fillRect(0, 0, starFieldWidth, starFieldHeight);
      const lowerCenterX = starFieldWidth * 0.74;
      const lowerCenterY = starFieldHeight * 0.7;
      const lowerRadius = Math.hypot(
        Math.max(lowerCenterX, starFieldWidth - lowerCenterX),
        Math.max(lowerCenterY, starFieldHeight - lowerCenterY)
      );
      const lowerTint = baseContext.createRadialGradient(
        lowerCenterX, lowerCenterY, 0,
        lowerCenterX, lowerCenterY, lowerRadius
      );
      lowerTint.addColorStop(0, 'rgba(120,70,130,.14)');
      lowerTint.addColorStop(0.5, 'rgba(120,70,130,0)');
      lowerTint.addColorStop(1, 'rgba(120,70,130,0)');
      baseContext.fillStyle = lowerTint;
      baseContext.fillRect(0, 0, starFieldWidth, starFieldHeight);
    };

    const drawDeepLayer = () => {
      const pixelRatio = window.devicePixelRatio || 1;
      const deepHeight = starFieldHeight * 1.6;
      deepCanvas.width = starFieldWidth * pixelRatio;
      deepCanvas.height = deepHeight * pixelRatio;
      deepContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      deepContext.clearRect(0, 0, starFieldWidth, deepHeight);
      const maxDimension = Math.max(starFieldWidth, deepHeight);
      const primaryBandHeight = starFieldHeight * 0.35;
      const primaryBandTop = deepHeight * 0.38 - primaryBandHeight / 2;
      const primaryBandGradient = deepContext.createLinearGradient(
        0, primaryBandTop, 0, primaryBandTop + primaryBandHeight
      );
      primaryBandGradient.addColorStop(0, 'rgba(201,215,255,0)');
      primaryBandGradient.addColorStop(0.5, 'rgba(201,215,255,0.05)');
      primaryBandGradient.addColorStop(1, 'rgba(201,215,255,0)');
      deepContext.fillStyle = primaryBandGradient;
      deepContext.fillRect(0, primaryBandTop, starFieldWidth, primaryBandHeight);
      const secondaryBandHeight = starFieldHeight * 0.18;
      const secondaryBandTop = deepHeight * 0.55 - secondaryBandHeight / 2;
      const secondaryBandGradient = deepContext.createLinearGradient(
        0, secondaryBandTop, 0, secondaryBandTop + secondaryBandHeight
      );
      secondaryBandGradient.addColorStop(0, 'rgba(201,215,255,0)');
      secondaryBandGradient.addColorStop(0.5, 'rgba(201,215,255,0.03)');
      secondaryBandGradient.addColorStop(1, 'rgba(201,215,255,0)');
      deepContext.fillStyle = secondaryBandGradient;
      deepContext.fillRect(0, secondaryBandTop, starFieldWidth, secondaryBandHeight);
      const nebulaBlobs = [
        { colorChannels: '144,133,233', alpha: 0.1, centerX: starFieldWidth * 0.25, centerY: deepHeight * 0.3, blobRadius: maxDimension * 0.38 },
        { colorChannels: '57,135,229', alpha: 0.08, centerX: starFieldWidth * 0.72, centerY: deepHeight * 0.58, blobRadius: maxDimension * 0.32 },
        { colorChannels: '213,81,129', alpha: 0.06, centerX: starFieldWidth * 0.48, centerY: deepHeight * 0.85, blobRadius: maxDimension * 0.26 },
        { colorChannels: '236,131,90', alpha: 0.035, centerX: starFieldWidth * 0.85, centerY: deepHeight * 0.18, blobRadius: maxDimension * 0.18 },
      ];
      for (const blob of nebulaBlobs) {
        for (const wrapOffset of [-starFieldWidth, 0, starFieldWidth]) {
          const wrappedCenterX = blob.centerX + wrapOffset;
          const gradient = deepContext.createRadialGradient(
            wrappedCenterX, blob.centerY, 0,
            wrappedCenterX, blob.centerY, blob.blobRadius
          );
          gradient.addColorStop(0, `rgba(${blob.colorChannels},${blob.alpha})`);
          gradient.addColorStop(0.45, `rgba(${blob.colorChannels},${blob.alpha})`);
          gradient.addColorStop(1, `rgba(${blob.colorChannels},0)`);
          deepContext.fillStyle = gradient;
          deepContext.fillRect(0, 0, starFieldWidth, deepHeight);
        }
      }
    };

    const drawVignetteLayer = () => {
      const pixelRatio = window.devicePixelRatio || 1;
      vignetteCanvas.width = starFieldWidth * pixelRatio;
      vignetteCanvas.height = starFieldHeight * pixelRatio;
      vignetteContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      vignetteContext.clearRect(0, 0, starFieldWidth, starFieldHeight);
      const maxDimension = Math.max(starFieldWidth, starFieldHeight);
      const vignetteGradient = vignetteContext.createRadialGradient(
        starFieldWidth / 2, starFieldHeight / 2, 0,
        starFieldWidth / 2, starFieldHeight / 2, maxDimension
      );
      vignetteGradient.addColorStop(0, 'rgba(0,0,0,0)');
      vignetteGradient.addColorStop(0.6, 'rgba(0,0,0,0)');
      vignetteGradient.addColorStop(1, 'rgba(0,0,0,0.35)');
      vignetteContext.fillStyle = vignetteGradient;
      vignetteContext.fillRect(0, 0, starFieldWidth, starFieldHeight);
    };

    const resizeStarsCanvas = () => {
      const pixelRatio = window.devicePixelRatio || 1;
      starFieldWidth = window.innerWidth;
      starFieldHeight = window.innerHeight;
      starsCanvas.width = starFieldWidth * pixelRatio;
      starsCanvas.height = starFieldHeight * pixelRatio;
      starsContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      drawBaseLayer();
      drawDeepLayer();
      drawVignetteLayer();
    };

    const renderStars = (timestamp) => {
      if (backgroundTheme !== 'galaxy') {
        starsFrameId = null;
        return;
      }
      let parallaxPanX = accumulatedPanX;
      let parallaxPanY = 0;
      if (viewDimension === '2d' && typeof graph2dInstance !== 'undefined') {
        parallaxPanX = pan2dX * 0.6;
        parallaxPanY = pan2dY * 0.6;
      } else if (typeof graphInstance !== 'undefined' && graphInstance.camera()) {
        const cameraPosition = graphInstance.camera().position;
        const azimuth = Math.atan2(cameraPosition.x, cameraPosition.z);
        const elevation = Math.atan2(
          cameraPosition.y,
          Math.hypot(cameraPosition.x, cameraPosition.z)
        );
        if (previousAzimuth === null) {
          previousAzimuth = azimuth;
        } else {
          let azimuthDelta = azimuth - previousAzimuth;
          if (azimuthDelta > Math.PI) azimuthDelta -= 2 * Math.PI;
          if (azimuthDelta < -Math.PI) azimuthDelta += 2 * Math.PI;
          accumulatedPanX += (azimuthDelta / (2 * Math.PI)) * starFieldWidth * 2;
          previousAzimuth = azimuth;
        }
        parallaxPanY = (elevation / (Math.PI / 2)) * starFieldHeight * 0.5;
        parallaxPanX = accumulatedPanX;
      }
      starsContext.clearRect(0, 0, starFieldWidth, starFieldHeight);
      starsContext.drawImage(baseCanvas, 0, 0, starFieldWidth, starFieldHeight);
      const deepHeight = starFieldHeight * 1.6;
      const deepOffsetX = Math.round(
        (((parallaxPanX * 0.25) % starFieldWidth) + starFieldWidth) % starFieldWidth
      );
      const deepOffsetY = Math.round(-0.3 * starFieldHeight + parallaxPanY * 0.25);
      starsContext.drawImage(deepCanvas, deepOffsetX, deepOffsetY, starFieldWidth, deepHeight);
      starsContext.drawImage(
        deepCanvas, deepOffsetX - starFieldWidth, deepOffsetY, starFieldWidth, deepHeight
      );
      for (const star of stars) {
        star.xPosition += star.driftX;
        star.yPosition += star.driftY;
        if (star.xPosition < 0) star.xPosition += starFieldWidth;
        if (star.xPosition > starFieldWidth) star.xPosition -= starFieldWidth;
        if (star.yPosition < 0) star.yPosition += starFieldHeight;
        if (star.yPosition > starFieldHeight) star.yPosition -= starFieldHeight;
        const screenX =
          (((star.xPosition + parallaxPanX * star.depthFactor) % starFieldWidth) +
            starFieldWidth) % starFieldWidth;
        const screenY =
          (((star.yPosition + parallaxPanY * star.depthFactor) % starFieldHeight) +
            starFieldHeight) % starFieldHeight;
        starsContext.globalAlpha =
          0.25 + 0.55 * Math.abs(Math.sin(star.twinklePhase + timestamp * 0.001 * star.twinkleSpeed));
        starsContext.fillStyle = star.color;
        if (star.isBright) {
          starsContext.shadowBlur = 9;
          starsContext.shadowColor = star.color;
        }
        starsContext.beginPath();
        starsContext.arc(screenX, screenY, star.radius, 0, Math.PI * 2);
        starsContext.fill();
        if (star.isBright) {
          starsContext.shadowBlur = 0;
        }
      }
      starsContext.globalAlpha = 1;
      starsContext.drawImage(vignetteCanvas, 0, 0, starFieldWidth, starFieldHeight);
      starsFrameId = requestAnimationFrame(renderStars);
    };

    const updateStarsLoop = () => {
      if (backgroundTheme === 'galaxy' && starsFrameId === null) {
        starsFrameId = requestAnimationFrame(renderStars);
      } else if (backgroundTheme !== 'galaxy' && starsFrameId !== null) {
        cancelAnimationFrame(starsFrameId);
        starsFrameId = null;
      }
    };

    const setBackgroundTheme = (theme) => {
      backgroundTheme = theme === 'plain' ? 'plain' : 'galaxy';
      try {
        localStorage.setItem('slopmap-theme', backgroundTheme);
      } catch (storageError) {}
      starsCanvas.style.display = backgroundTheme === 'galaxy' ? 'block' : 'none';
      updateStarsLoop();
      for (const themeButton of themeButtons) {
        themeButton.classList.toggle('active', themeButton.dataset.theme === backgroundTheme);
      }
    };

    const showView = (view) => {
      currentView = view;
      selectedNode = null;
      selectedSection = null;
      selectedInspectorTab = 'files';
      clearSelectionDisplacement();
      for (const viewButton of viewButtons) {
        viewButton.classList.toggle('active', viewButton.dataset.view === view);
      }
      labelsElement.hidden = !isAggregatedView() || viewDimension !== '3d';
      compactnessSettingElement.hidden = !isAggregatedView();
      filesControlsElement.hidden = isAggregatedView();
      compactnessLevelElement.textContent = { 1: 'roots', 2: 'groups', 3: 'dirs' }[compactnessLevel];
      if (isAggregatedView()) {
        const aggregate = activeAggregate();
        rebuildSectionLabels();
        activeGraph().graphData({
          nodes: aggregate.sections,
          links: aggregate.links,
        });
        activeGraph().d3Force('charge').strength(-160);
        activeGraph().d3Force('link').distance(
          compactnessLevel === 1
            ? 120
            : compactnessLevel === 2
              ? 100
              : (link) => link.kind === 'orbit' ? 70 : 110
        );
      } else {
        activeGraph().graphData(applyFilters());
        activeGraph().d3Force('charge').strength(-45);
        activeGraph().d3Force('link').distance(35);
      }
      updateSectionLabelLoop();
      renderInspector();
      activeGraph().zoomToFit(600);
      pendingFitAfterStop = true;
    };

    const clearSelectionDisplacement = () => {
      if (displacedOriginals.size === 0) return;
      for (const [displacedNode, original] of displacedOriginals) {
        displacedNode.x = original.x;
        displacedNode.y = original.y;
        displacedNode.fx = original.fx;
        displacedNode.fy = original.fy;
        if (original.z !== undefined) {
          displacedNode.z = original.z;
          displacedNode.fz = original.fz;
        }
      }
      displacedOriginals.clear();
      activeGraph().graphData(activeGraph().graphData());
    };

    const applySelectionDisplacement = (originNode) => {
      clearSelectionDisplacement();
      const pushRadius = isAggregatedView() ? AGGREGATE_PUSH_RADIUS : 90;
      const maxPush = 26;
      for (const graphNode of activeGraph().graphData().nodes) {
        if (graphNode === originNode) continue;
        const deltaX = graphNode.x - originNode.x;
        const deltaY = graphNode.y - originNode.y;
        const deltaZ = (graphNode.z ?? 0) - (originNode.z ?? 0);
        const distance = Math.max(Math.hypot(deltaX, deltaY, deltaZ), 1);
        if (distance >= pushRadius) continue;
        displacedOriginals.set(graphNode, {
          x: graphNode.x,
          y: graphNode.y,
          z: graphNode.z,
          fx: graphNode.fx,
          fy: graphNode.fy,
          fz: graphNode.fz,
        });
        const pushDistance = ((pushRadius - distance) / pushRadius) * maxPush;
        graphNode.x += deltaX / distance * pushDistance;
        graphNode.fx = graphNode.x;
        graphNode.y += deltaY / distance * pushDistance;
        graphNode.fy = graphNode.y;
        if (graphNode.z !== undefined) {
          graphNode.z += deltaZ / distance * pushDistance;
          graphNode.fz = graphNode.z;
        }
      }
      activeGraph().graphData(activeGraph().graphData());
    };

    const deselectSelection = () => {
      selectedNode = null;
      selectedSection = null;
      selectedInspectorTab = 'files';
      clearSelectionDisplacement();
      activeGraph().nodeColor(nodeColorFor);
      renderInspector();
    };

    const selectSection = (section) => {
      selectedNode = section;
      selectedSection = section;
      selectedInspectorTab = 'files';
      applySelectionDisplacement(section);
      activeGraph().nodeColor(nodeColorFor);
      renderInspector();
    };

    const handleNodeClick = (node) => {
      const isDeselecting = selectedNode === node;
      if (isDeselecting) {
        deselectSelection();
      } else {
        if (isAggregatedView()) {
          selectSection(node);
          return;
        }
        selectedNode = node;
        selectedSection = null;
        applySelectionDisplacement(node);
        renderInspector();
        if (viewDimension === '2d') {
          graph2dInstance.centerAt(node.x, node.y, 800);
          graph2dInstance.zoom(Math.max(graph2dInstance.zoom(), 4), 800);
        } else {
          const distance = 140;
          const length = Math.hypot(node.x, node.y, node.z) || 1;
          const ratio = 1 + distance / length;
          graphInstance.cameraPosition(
            { x: node.x * ratio, y: node.y * ratio, z: node.z * ratio },
            node,
            800
          );
        }
        activeGraph().nodeColor(nodeColorFor);
      }
    };

    const handleBackgroundClick = () => {
      if (selectedNode === null && selectedSection === null) return;
      deselectSelection();
    };

    repoNameElement.textContent = payload.repoName;
    overviewMetaElement.textContent =
      `${payload.graph.stats.fileCount} files · ${payload.graph.stats.linkCount} imports`;
    renderContext();
    impactOption.hidden = !diffMode;
    renderLegend();

    const drawSpacedCanvasText = (
      canvasContext,
      labelText,
      centerX,
      baselineY,
      characterSpacing
    ) => {
      const characters = [...labelText];
      const textWidth = characters.reduce(
        (totalWidth, character) => totalWidth + canvasContext.measureText(character).width,
        0
      ) + characterSpacing * Math.max(characters.length - 1, 0);
      let cursorX = centerX - textWidth / 2;
      for (const character of characters) {
        canvasContext.fillText(character, cursorX, baselineY);
        cursorX += canvasContext.measureText(character).width + characterSpacing;
      }
    };

    const graphInstance = ForceGraph3D()(document.getElementById('graph'))
      .backgroundColor('rgba(18,20,42,0)')
      .nodeLabel(nodeLabelFor)
      .nodeVal(nodeValueFor)
      .nodeColor(nodeColorFor)
      .linkWidth(linkWidthFor)
      .linkColor(linkColorFor)
      .linkOpacity(0.35)
      .linkDirectionalParticles(particleCountFor)
      .linkDirectionalParticleWidth(1.4)
      .onNodeClick(handleNodeClick)
      .onBackgroundClick(handleBackgroundClick)
      .onEngineStop(() => {
        for (const graphNode of graphInstance.graphData().nodes) {
          graphNode.fx = graphNode.x;
          graphNode.fy = graphNode.y;
          graphNode.fz = graphNode.z;
        }
        if (!pendingFitAfterStop || viewDimension !== '3d') return;
        pendingFitAfterStop = false;
        graphInstance.zoomToFit(600);
      });

    const graph2dInstance = ForceGraph()(graph2dElement)
      .backgroundColor('rgba(18,20,42,0)')
      .nodeVal(nodeValueFor)
      .nodeColor(nodeColorFor)
      .nodeLabel(nodeLabelFor)
      .linkColor(linkColorFor)
      .linkWidth(linkWidthFor)
      .linkDirectionalParticles(particleCountFor)
      .linkDirectionalParticleWidth(1.4)
      .onRenderFramePre((canvasContext, globalScale) => {
        if (
          viewDimension !== '2d' ||
          !isAggregatedView() ||
          selectedSection === null ||
          (selectedSection.downstreamTotal || 0) === 0 ||
          selectedSection.x === undefined ||
          selectedSection.y === undefined
        ) return;
        canvasContext.save();
        canvasContext.beginPath();
        canvasContext.setLineDash([6 / globalScale, 5 / globalScale]);
        canvasContext.strokeStyle = 'rgba(240,138,75,.35)';
        canvasContext.lineWidth = 1 / globalScale;
        canvasContext.arc(
          selectedSection.x,
          selectedSection.y,
          AGGREGATE_PUSH_RADIUS,
          0,
          Math.PI * 2
        );
        canvasContext.stroke();
        canvasContext.setLineDash([]);
        canvasContext.font = `500 ${10.5 / globalScale}px "IBM Plex Mono", monospace`;
        canvasContext.fillStyle = 'rgba(240,138,75,.6)';
        canvasContext.textAlign = 'left';
        drawSpacedCanvasText(
          canvasContext,
          `BLAST RADIUS · ${selectedSection.downstreamTotal} files`,
          selectedSection.x,
          selectedSection.y + AGGREGATE_PUSH_RADIUS + 18 / globalScale,
          .6 / globalScale
        );
        canvasContext.restore();
      })
      .nodeCanvasObjectMode(() => 'after')
      .nodeCanvasObject((node, canvasContext, globalScale) => {
        if (node.fileCount === undefined) return;
        const isHub = compactnessLevel !== 3 || node.id === node.group;
        const labelText = isHub ? node.id : node.id.split('/').at(-1);
        const fontSize = 12 / globalScale;
        const verticalOffset = Math.sqrt(nodeValueFor(node)) * 4 / globalScale + 12 / globalScale;
        canvasContext.font = `${isHub ? 600 : 500} ${fontSize}px "Inter", system-ui, sans-serif`;
        canvasContext.fillStyle = isHub ? '#ffffff' : 'rgba(255,255,255,.72)';
        canvasContext.textAlign = 'center';
        canvasContext.shadowColor = 'rgba(0,0,0,.9)';
        canvasContext.shadowBlur = 3;
        canvasContext.fillText(labelText, node.x, node.y + verticalOffset);
        canvasContext.shadowColor = 'transparent';
        canvasContext.shadowBlur = 0;
      })
      .onNodeClick(handleNodeClick)
      .onBackgroundClick(handleBackgroundClick)
      .onEngineStop(() => {
        for (const graphNode of graph2dInstance.graphData().nodes) {
          graphNode.fx = graphNode.x;
          graphNode.fy = graphNode.y;
        }
        if (!pendingFitAfterStop || viewDimension !== '2d') return;
        pendingFitAfterStop = false;
        graph2dInstance.zoomToFit(600);
      })
      .onZoom(({ x: transformX, y: transformY }) => {
        pan2dX = transformX;
        pan2dY = transformY;
      });

    const resizeGraphArea = () => {
      const graphAreaWidth = window.innerWidth - 60 - 452;
      const graphAreaHeight = window.innerHeight - 64;
      graphInstance.width(graphAreaWidth).height(graphAreaHeight);
      graph2dInstance.width(graphAreaWidth).height(graphAreaHeight);
    };
    resizeGraphArea();

    const activeGraph = () => viewDimension === '2d' ? graph2dInstance : graphInstance;

    const setViewDimension = (dimension) => {
      clearSelectionDisplacement();
      viewDimension = dimension === '2d' ? '2d' : '3d';
      try {
        localStorage.setItem('slopmap-dimension', viewDimension);
      } catch (storageError) {}
      graphElement.hidden = viewDimension !== '3d';
      graph2dElement.hidden = viewDimension !== '2d';
      dimensionButton.classList.toggle('active', viewDimension === '2d');
      showView(currentView);
      updateSectionLabelLoop();
    };

    for (const viewButton of viewButtons) {
      viewButton.addEventListener('click', () => showView(viewButton.dataset.view));
    }
    compactnessInput.value = String(compactnessLevel);
    compactnessInput.addEventListener('input', () => {
      compactnessLevel = Number(compactnessInput.value);
      try {
        localStorage.setItem('slopmap-compactness', String(compactnessLevel));
      } catch (storageError) {}
      showView('compact');
    });
    for (const themeButton of themeButtons) {
      themeButton.addEventListener('click', () => setBackgroundTheme(themeButton.dataset.theme));
    }
    dimensionButton.addEventListener('click', () => {
      setViewDimension(viewDimension === '2d' ? '3d' : '2d');
    });
    helpButton.addEventListener('click', () => {
      helpPopoverElement.hidden = !helpPopoverElement.hidden;
    });
    helpPopoverElement.addEventListener('click', () => {
      helpPopoverElement.hidden = true;
    });
    searchInput.addEventListener('input', () => {
      filterState.searchTerm = searchInput.value.toLowerCase();
      activeGraph().nodeColor(nodeColorFor);
    });
    impactOnlyInput.addEventListener('change', refreshFilesView);
    hideIsolatedInput.addEventListener('change', refreshFilesView);
    clearSectionFilterButton.addEventListener('click', () => {
      aggregateFilter = null;
      renderAggregateFilter();
      refreshFilesView();
    });
    detailCloseButton.addEventListener('click', deselectSelection);
    copyPathsButton.addEventListener('click', async () => {
      if (selectedSection === null) return;
      const sectionPaths = changedFilesFor(selectedSection).map(
        (changeFile) => changeFile.path
      );
      try {
        await navigator.clipboard.writeText(sectionPaths.join('\n'));
        copyPathsButton.textContent = 'Copied';
        window.setTimeout(() => {
          copyPathsButton.textContent = 'Copy paths';
        }, 1500);
      } catch (clipboardError) {}
    });
    openFilesButton.addEventListener('click', () => {
      if (selectedSection === null) return;
      aggregateFilter = {
        mode: compactnessLevel === 1 ? 'root' : compactnessLevel === 2 ? 'group' : 'section',
        value: selectedSection.id,
      };
      impactOnlyInput.checked = true;
      renderAggregateFilter();
      showView('files');
    });

    resizeStarsCanvas();
    window.addEventListener('resize', () => {
      resizeStarsCanvas();
      resizeGraphArea();
    });

    renderAggregateFilter();
    setBackgroundTheme(backgroundTheme);
    setViewDimension(viewDimension);
  </script>
</body>
</html>
